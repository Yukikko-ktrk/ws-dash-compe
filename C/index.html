<!DOCTYPE html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>しまWS大会ダッシュボード — 16:9 Arena Edition</title>
<style>
  :root {
    --font-sans: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    --font-serif: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --font-mono: "IBM Plex Mono", "Cascadia Code", "Consolas", monospace;

    /* Schwarz テーマ (主催者用・劇場黒基調) */
    --bg-base: #0e1014;
    --bg-surface: #14171e;
    --card: #1b1f28;
    --card-hover: #222734;
    --card-edge: #2c3342;
    --card-edge-light: #3d4659;

    --ink: #f0f2f5;
    --ink-sub: #b2b8c4;
    --ink-muted: #727a8a;

    --accent: #7ca3ff;
    --accent-glow: rgba(124, 163, 255, 0.28);
    --accent-dark: #1e283d;

    --ok: #5eead4;
    --ok-glow: rgba(94, 234, 212, 0.25);
    --ok-bg: #112d27;

    --wait: #fbbf24;
    --wait-glow: rgba(251, 191, 36, 0.25);
    --wait-bg: #352a11;

    --danger: #f87171;
    --danger-glow: rgba(248, 113, 113, 0.25);
    --danger-bg: #38181a;

    --secret-bg: #161922;
    --secret-edge: #3c4456;
    --secret-ink: #8f98aa;

    --gold: #f59e0b;
    --silver: #94a3b8;
    --bronze: #d97706;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-base);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13.5px;
    line-height: 1.45;
  }

  /* 16:9 全画面レイアウト */
  .arena-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 10px 14px 14px;
    background: radial-gradient(circle at 50% 0%, #171c26 0%, var(--bg-base) 75%);
    overflow: hidden;
  }

  /* ==========================================================================
     Top Bar & Director's Header
     ========================================================================== */
  .arena-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    flex: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  .app-branding {
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  .app-name {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .app-name::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--accent);
  }
  .tournament-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badges-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--ink-sub);
    white-space: nowrap;
  }
  .chip.code { font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.05em; }
  .chip.rule { background: var(--accent-dark); border-color: var(--accent); color: var(--accent); }
  .chip.live { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .chip.live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.8; }
  }

  /* 人数切り替えピル (8人 / 16人) */
  .players-toggle {
    display: flex;
    background: #090b0e;
    padding: 2px;
    border-radius: 7px;
    border: 1px solid var(--card-edge);
  }
  .players-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .players-btn.active {
    background: #252d3d;
    color: #fff;
    border: 1px solid var(--accent);
  }

  /* 主催者コントロール (Director's Dock) */
  .director-dock {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    flex: none;
  }

  /* 審査員・デモ用ステートスイッチャー */
  .state-switcher {
    display: flex;
    background: #0b0d11;
    padding: 2px;
    border-radius: 7px;
    border: 1px solid var(--card-edge);
  }
  .state-btn {
    background: transparent;
    border: none;
    color: var(--ink-muted);
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .state-btn:hover { color: var(--ink); }
  .state-btn.active {
    background: var(--accent);
    color: #0b0d11;
    box-shadow: 0 2px 8px var(--accent-glow);
  }

  .nav-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-sub);
    text-decoration: none;
    padding: 5px 10px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-link-btn:hover {
    color: #fff;
    border-color: var(--accent);
    background: var(--card-hover);
  }

  /* ==========================================================================
     Main Split Layout (16:9 Arena)
     ========================================================================== */
  .arena-grid {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  /* 16人時のグリッド最適化: 8卓を綺麗に見せるため左幅をやや確保 */
  .arena-grid.mode-16 {
    grid-template-columns: 490px 1fr;
    gap: 12px;
  }

  @media (min-width: 1600px) {
    .arena-grid {
      grid-template-columns: 480px 1fr;
      gap: 16px;
    }
    .arena-grid.mode-16 {
      grid-template-columns: 540px 1fr;
      gap: 16px;
    }
  }

  /* ==========================================================================
     Left Column: Operations & Arena Timer
     ========================================================================== */
  .col-ops {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  .card-panel {
    background: var(--bg-surface);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    position: relative;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 6px;
    flex: none;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-sub);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-title svg {
    color: var(--accent);
    flex: none;
  }

  /* --- 特大カウントダウンタイマー --- */
  .timer-card {
    background: linear-gradient(180deg, #181d27 0%, #12141a 100%);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 10px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    flex: none;
  }
  .timer-card::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .timer-badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .timer-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
  }
  .timer-status-pill {
    font-size: 10px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
  }
  .timer-status-pill.stopped {
    background: var(--wait-bg);
    color: var(--wait);
    border-color: var(--wait);
  }

  .timer-display-box {
    margin: 2px 0 6px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .timer-digits {
    font-family: var(--font-mono);
    font-size: clamp(48px, 4.2vw, 72px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.06em;
    color: #ffffff;
    background: transparent;
    border: 1px dashed transparent;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    max-width: 340px;
    cursor: text;
    transition: all 0.2s;
    text-shadow: 0 0 20px rgba(124, 163, 255, 0.4);
  }
  .timer-digits:hover {
    border-color: var(--card-edge-light);
    background: rgba(255, 255, 255, 0.02);
  }
  .timer-digits:focus {
    outline: none;
    border-color: var(--accent);
    background: #0c0e13;
  }
  .timer-digits.timeup {
    color: var(--danger);
    text-shadow: 0 0 25px rgba(248, 113, 113, 0.6);
    animation: flash 1s infinite alternate;
  }
  @keyframes flash {
    from { opacity: 0.7; }
    to { opacity: 1; }
  }

  .timer-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .btn {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 15px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.2s;
    user-select: none;
  }
  .btn.primary {
    background: var(--accent);
    color: #0d1118;
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .btn.primary:hover { background: #96b6ff; }
  .btn.danger {
    background: var(--danger);
    color: #120506;
    box-shadow: 0 2px 10px var(--danger-glow);
  }
  .btn.danger:hover { background: #fca5a5; }
  .btn.ghost {
    background: var(--card);
    border-color: var(--card-edge);
    color: var(--ink);
  }
  .btn.ghost:hover {
    background: var(--card-hover);
    border-color: var(--card-edge-light);
  }
  .btn.success {
    background: var(--ok);
    color: #051a14;
    box-shadow: 0 2px 10px var(--ok-glow);
  }
  .btn.success:hover { background: #99f6e4; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .timer-hint {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 5px;
  }

  /* --- 進行状況 & ラウンド情報 --- */
  .progress-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    margin-bottom: 4px;
    flex: none;
  }
  .prog-bar-bg {
    height: 5px;
    border-radius: 99px;
    background: var(--card);
    overflow: hidden;
    margin-bottom: 8px;
    border: 1px solid var(--card-edge);
    flex: none;
  }
  .prog-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--ok));
    box-shadow: 0 0 10px var(--ok-glow);
    transition: width 0.4s ease;
  }

  /* 対戦カードリスト (8人時は縦1列、16人時は2列グリッド) */
  .matches-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
  }
  .matches-list.grid-16 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .matches-list::-webkit-scrollbar { width: 5px; }
  .matches-list::-webkit-scrollbar-thumb { background: var(--card-edge); border-radius: 4px; }

  .match-card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 7px;
    padding: 7px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: border-color 0.2s;
  }
  .match-card:hover { border-color: var(--card-edge-light); }
  .match-card.confirmed { border-left: 3px solid var(--ok); }
  .match-card.pending { border-left: 3px solid var(--wait); }
  .match-card.playing { border-left: 3px solid var(--accent); }

  .match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
  }
  .table-num {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--ink-sub);
    letter-spacing: 0.05em;
  }

  .match-fighters {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .fighter {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fighter.right { text-align: right; }
  .fighter.winner { color: var(--ok); }
  .fighter.loser { color: var(--ink-muted); text-decoration: line-through; }
  .vs-sign {
    font-family: var(--font-serif);
    font-size: 10.5px;
    color: var(--ink-muted);
    font-style: italic;
    flex: none;
  }

  .match-deck-preview {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--ink-muted);
  }
  .deck-name-trunc {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 下書き時ドロップダウン */
  .match-edit-row {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-top: 2px;
  }
  .select-player {
    flex: 1;
    background: var(--bg-surface);
    color: var(--ink);
    border: 1px solid var(--card-edge);
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 11px;
    font-family: var(--font-sans);
    min-width: 0;
  }

  /* 下書き操作ツールバー */
  .draft-actions-bar {
    display: flex;
    gap: 6px;
    padding: 7px;
    background: #0f1218;
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    margin-top: 6px;
    flex: none;
  }

  /* ==========================================================================
     Right Column: Leaderboard & Reveal Showcases
     ========================================================================== */
  .col-stage {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }

  /* ランキングテーブル */
  .ranking-card {
    background: var(--bg-surface);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  /* 16人時の左右2列スプリットコンテナ */
  .standings-split-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  .ranking-table-container {
    flex: 1;
    overflow-y: auto;
    margin-top: 2px;
  }
  .ranking-table-container::-webkit-scrollbar { width: 5px; }
  .ranking-table-container::-webkit-scrollbar-thumb { background: var(--card-edge); border-radius: 4px; }

  table.standings-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 4px;
    font-size: 13px;
  }

  /* 16人モード時の文字・余白最適化 (本文18〜20px見え、遠くから読める) */
  @media (min-width: 1400px) {
    .mode-16 table.standings-table {
      font-size: 14px;
    }
    .mode-16 .player-cell-main {
      font-size: 15.5px !important;
    }
  }

  table.standings-table th {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    text-align: left;
    padding: 2px 6px 4px;
    border-bottom: 1px solid var(--card-edge);
    white-space: nowrap;
  }
  table.standings-table th.num { text-align: right; }

  table.standings-table tbody tr {
    background: var(--card);
    transition: all 0.2s ease;
  }
  table.standings-table tbody tr:hover {
    background: var(--card-hover);
    transform: translateX(2px);
  }

  table.standings-table td {
    padding: 5px 6px;
    vertical-align: middle;
    border-top: 1px solid var(--card-edge);
    border-bottom: 1px solid var(--card-edge);
  }
  table.standings-table td:first-child {
    border-left: 1px solid var(--card-edge);
    border-radius: 7px 0 0 7px;
  }
  table.standings-table td:last-child {
    border-right: 1px solid var(--card-edge);
    border-radius: 0 7px 7px 0;
  }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 800;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
  }
  .rank-1 .rank-badge {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #120a02;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
  }
  .rank-2 .rank-badge {
    background: linear-gradient(135deg, #cbd5e1, #94a3b8);
    color: #0f172a;
    box-shadow: 0 0 8px rgba(203, 213, 225, 0.3);
  }
  .rank-3 .rank-badge {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #ffffff;
    box-shadow: 0 0 8px rgba(217, 119, 6, 0.3);
  }

  .player-cell-main {
    font-weight: 700;
    font-size: 13.5px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  /* デッキカード群 (横並び) */
  .player-decks-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* デッキピル / カード */
  .deck-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10.5px;
    border: 1px solid var(--card-edge-light);
    background: #131720;
    color: var(--ink);
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deck-pill.used-win {
    background: rgba(255, 255, 255, 0.02);
    border-color: rgba(255, 255, 255, 0.07);
    color: var(--ink-muted);
    text-decoration: line-through;
  }
  .deck-pill.used-win .deck-cost-tag {
    background: #252830;
    color: var(--ink-muted);
  }
  .deck-pill.revealed {
    border-color: var(--accent);
    background: rgba(124, 163, 255, 0.08);
  }

  /* 伏せカード (SECRET DECK) */
  .deck-pill.secret {
    background: linear-gradient(135deg, #131720 0%, #1a1e2a 100%);
    border: 1px dashed var(--secret-edge);
    color: var(--secret-ink);
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
    user-select: none;
  }
  .deck-pill.secret .secret-q {
    font-family: var(--font-serif);
    font-weight: 800;
    color: var(--accent);
    background: rgba(124, 163, 255, 0.15);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
  }

  .deck-cost-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    background: var(--card-edge);
    color: var(--accent);
    padding: 0 4px;
    border-radius: 3px;
  }

  .score-cell {
    font-family: var(--font-mono);
    font-weight: 700;

  if (count === 8) return BASE_PLAYERS_8;
  const merged = [...BASE_PLAYERS_8, ...EXTRA_PLAYERS_8].sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (b.omw !== a.omw) return b.omw - a.omw;
    return a.losses - b.losses;
  });
  return merged.map((p, idx) => ({ ...p, rank: idx + 1 }));
}

// ==========================================================================
// カウントダウンタイマー (初期値 35:00)
// ==========================================================================
const timerState = {
  running: false,
  remainSec: 35 * 60,
  startSec: 35 * 60,
  intervalId: null
};

function formatTimer(sec) {
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${String(m).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
}

function parseTimer(str) {
  const parts = String(str || "").trim().split(":");
  if (parts.length === 2) {
    const m = parseInt(parts[0], 10);
    const s = parseInt(parts[1], 10);
    if (!isNaN(m) && !isNaN(s)) return m * 60 + s;
  } else if (parts.length === 1) {
    const m = parseInt(parts[0], 10);
    if (!isNaN(m)) return m * 60;
  }
  return null;
}

function timerStart() {
  if (timerState.running) return;
  const inputEl = document.getElementById("timer-input");
  if (inputEl) {
    const parsed = parseTimer(inputEl.value);
    if (parsed !== null && parsed > 0) {
      timerState.remainSec = parsed;
      timerState.startSec = parsed;
    }
  }
  timerState.running = true;
  clearInterval(timerState.intervalId);
  timerState.intervalId = setInterval(() => {
    if (timerState.remainSec > 0) {
      timerState.remainSec--;
      updateTimerDisplay();
    } else {
      timerState.running = false;
      clearInterval(timerState.intervalId);
      updateTimerDisplay();
      showToast("⏰ 対戦時間終了 (00:00) です！");
    }
  }, 1000);
  updateTimerDisplay();
  showToast("タイマーをスタートしました");
}

function timerStop() {
  if (!timerState.running) return;
  timerState.running = false;
  clearInterval(timerState.intervalId);
  updateTimerDisplay();
  showToast("タイマーを停止しました");
}

function timerReset() {
  timerState.running = false;
  clearInterval(timerState.intervalId);
  timerState.remainSec = timerState.startSec || 35 * 60;
  updateTimerDisplay();
  showToast("タイマーを初期値にリセットしました");
}

function updateTimerDisplay() {
  const inputEl = document.getElementById("timer-input");
  const pillEl = document.getElementById("timer-status-pill");
  const btnStart = document.getElementById("btn-timer-start");
  const btnStop = document.getElementById("btn-timer-stop");
  const btnReset = document.getElementById("btn-timer-reset");

  if (!inputEl) return;
  inputEl.value = formatTimer(timerState.remainSec);
  inputEl.readOnly = timerState.running;

  if (timerState.remainSec <= 0) {
    inputEl.classList.add("timeup");
  } else {
    inputEl.classList.remove("timeup");
  }

  if (pillEl) {
    if (timerState.running) {
      pillEl.textContent = "COUNTING DOWN";
      pillEl.className = "timer-status-pill";
    } else {
      pillEl.textContent = "PAUSED";
      pillEl.className = "timer-status-pill stopped";
    }
  }

  if (btnStart && btnStop && btnReset) {
    btnStart.style.display = timerState.running ? "none" : "inline-flex";
    btnStop.style.display = timerState.running ? "inline-flex" : "none";
    btnReset.disabled = timerState.running;
  }
}

function onTimerInput(e) {
  if (timerState.running) return;
  const val = parseTimer(e.target.value);
  if (val !== null) {
    timerState.remainSec = val;
    timerState.startSec = val;
  }
}

// ==========================================================================
// 画面状態 & 人数モード管理
// ==========================================================================
let currentState = "running"; // "running" | "draft" | "post_draft" | "post_result"
let currentPlayers = 8;       // 8 or 16
let postCostConfirmArmed = false;

function showToast(msg) {
  const t = document.getElementById("arena-toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2800);
}

function switchState(stateName) {
  currentState = stateName;
  postCostConfirmArmed = false;
  updateUrlParams();

  document.querySelectorAll(".state-btn").forEach(btn => btn.classList.remove("active"));
  const activeBtn = document.getElementById(`btn-state-${stateName.replace("_", "-")}`);
  if (activeBtn) activeBtn.classList.add("active");

  renderArena();
}

function switchPlayersMode(count) {
  currentPlayers = count;
  updateUrlParams();

  document.getElementById("btn-p8").classList.toggle("active", count === 8);
  document.getElementById("btn-p16").classList.toggle("active", count === 16);

  const arena = document.getElementById("main-arena");
  if (arena) {
    arena.classList.toggle("mode-16", count === 16);
  }

  const chip = document.getElementById("participant-count-chip");
  if (chip) chip.textContent = `${count}名参加 (${count / 2}卓)`;

  showToast(`${count}人大会モードに切り替えました`);
  renderArena();
}

function updateUrlParams() {
  const url = new URL(window.location);
  url.searchParams.set("state", currentState);
  url.searchParams.set("players", currentPlayers);
  window.history.replaceState({}, "", url);
}

// ==========================================================================
// 状態別レンダラー
// ==========================================================================
function renderArena() {
  const arena = document.getElementById("main-arena");
  if (!arena) return;

  arena.classList.toggle("mode-16", currentPlayers === 16);

  if (currentState === "running") {
    arena.innerHTML = `
      ${renderOpsColumnRunning()}
      ${renderStageColumnStandings(false)}
    `;
    updateTimerDisplay();
  } else if (currentState === "draft") {
    arena.innerHTML = `
      ${renderOpsColumnDraft()}
      ${renderStageColumnStandings(true)}
    `;
    updateTimerDisplay();
  } else if (currentState === "post_draft") {
    arena.innerHTML = renderPostCostDraftView();
  } else if (currentState === "post_result") {
    arena.innerHTML = renderPostCostResultView();
  }
}

function renderPlayerStandingRow(player) {
  const rankClass = `rank-${player.rank}`;

  const decksHtml = player.decks.map((d, idx) => {
    if (d.usedWin) {
      return `
        <span class="deck-pill used-win" title="${d.title} (${d.cx}) - 勝利により使用済み">
          <span class="deck-cost-tag">${d.baseCost.toFixed(1)}</span>
          <s>${d.title}</s>
        </span>
      `;
    } else if (idx === 1 && player.losses > 0) {
      return `
        <span class="deck-pill revealed" title="${d.title} (${d.cx}) - 公開済み (使用可能)">
          <span class="deck-cost-tag">${d.baseCost.toFixed(1)}</span>
          <span>${d.title}</span>
        </span>
      `;
    } else {
      return `
        <span class="deck-pill secret" title="未対戦・非公開デッキ">
          <span class="secret-q">?</span>
          <span>SECRET</span>
        </span>
      `;
    }
  }).join("");

  return `
    <tr class="${rankClass}">
      <td>
        <span class="rank-badge">${player.rank}</span>
      </td>
      <td>
        <div class="player-cell-main">
          <span>${player.name}</span>
        </div>
      </td>
      <td>
        <div class="player-decks-row">
          ${decksHtml}
        </div>
      </td>
      <td class="score-cell">
        <span style="color:${player.wins > 0 ? "var(--ok)" : "inherit"}">${player.wins}</span> -
        <span style="color:${player.losses > 0 ? "var(--danger)" : "inherit"}">${player.losses}</span> -
        <span>${player.draws}</span>
      </td>
      <td class="omw-cell">${(player.omw * 100).toFixed(1)}%</td>
    </tr>
  `;
}

function getSortedPostCostPlayers(players) {
  return [...players].map(p => {
    let totalAfter = 0;
    const deckBreakdown = p.decks.map(d => {
      const match = BASE_TITLES.find(rt => rt.title === d.title) || { base: d.baseCost, delta: 0, after: d.baseCost };
      totalAfter += match.after;
      return {
        title: d.title,
        base: match.base,
        delta: match.delta,
        after: match.after
      };
    });
    return {
      ...p,
      totalAfter,
      deckBreakdown
    };
  }).sort((a, b) => b.totalAfter - a.totalAfter);
}

function renderPostDraftPlayerRowsChunk(chunk, offsetIndex) {
  return chunk.map((p, idx) => `
    <tr>
      <td><span class="rank-badge" style="width:20px; height:20px; font-size:10.5px;">${offsetIndex + idx + 1}</span></td>
      <td style="font-weight:700;">${p.name}</td>
      <td>
        <div style="display:flex; flex-direction:column; gap:2px;">
          ${p.deckBreakdown.map(d => `
            <div style="font-size:10px; color:var(--ink-sub); display:flex; justify-content:space-between; gap:3px;">
              <span style="max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.title}</span>
              <span>
                ${d.base.toFixed(1)} 
                <span class="cost-delta-badge ${d.delta > 0 ? "plus" : d.delta < 0 ? "minus" : "zero"}" style="padding:0 2px; font-size:9px;">
                  ${d.delta > 0 ? "+" + d.delta.toFixed(1) : d.delta.toFixed(1)}
                </span>
                ＝ <strong>${d.after.toFixed(1)}</strong>
              </span>
            </div>
          `).join("")}
        </div>
      </td>
      <td class="num">
        <span class="total-cost-display">${p.totalAfter.toFixed(1)}</span>
      </td>
    </tr>
  `).join("");
}

function renderPostDraftPlayerRows(players) {
  const sorted = getSortedPostCostPlayers(players);
  return renderPostDraftPlayerRowsChunk(sorted, 0);
}

          </button>
        </div>
      </div>

      <!-- 2カラム結果発表グリッド (16人時は mode-16) -->
      <div class="postcost-tables-grid ${is16 ? "mode-16" : ""}">
        
        <!-- 左: 事後合計コストが高い順のソート発表表 (ハイローラーボード) -->
        <div class="post-card">
          <h3>
            <span style="color:#ffffff;">事後合計コスト順 ランキング発表</span>
            <span class="chip" style="background:var(--accent-dark); color:var(--accent); border-color:var(--accent);">高コスト順ソート</span>
          </h3>
          <div style="flex:1; overflow-y:auto;">
            ${resultTablesHtml}
          </div>
        </div>

        <!-- 右: 実際に持ち込まれたタイトル限定の確定コスト一覧 -->
        <div class="post-card">
          <h3>
            <span>持ち込まれたタイトルの確定コスト (${BASE_TITLES.length}種)</span>
            <span class="chip">変動範囲 ±0.5</span>
          </h3>
          <p style="font-size:11px; color:var(--ink-muted); margin-bottom:5px;">
            全168タイトルのうち、今回の大会で実際に参加者が使用したタイトルのみを抽出しています。
          </p>
          <div class="registered-titles-list ${is16 ? "grid-2col" : ""}">
            ${BASE_TITLES.map(t => `
              <div class="title-cost-item">
                <div>
                  <div class="title-cost-name">${t.title}</div>
                  <div class="title-cost-cx">CX構成: ${t.cx}</div>
                </div>
                <div class="title-cost-values">
                  <span style="color:var(--ink-muted);">${t.base.toFixed(1)}</span>
                  <span>→</span>
                  <span class="cost-delta-badge ${t.delta > 0 ? "plus" : t.delta < 0 ? "minus" : "zero"}">
                    ${t.delta > 0 ? "+" + t.delta.toFixed(1) : t.delta.toFixed(1)}
                  </span>
                  <span>＝</span>
                  <span style="font-weight:800; color:var(--ok); font-size:13px;">${t.after.toFixed(1)}</span>
                </div>
              </div>
            `).join("")}
          </div>
        </div>

      </div>
    </div>
  `;
}

function renderPostResultPlayerRowsChunk(chunk, offsetIndex) {
  return chunk.map((p, idx) => {
    const isTop = (offsetIndex === 0 && idx === 0);
    return `
      <tr style="${isTop ? "background:rgba(94, 234, 212, 0.06);" : ""}">
        <td>
          <span class="rank-badge ${offsetIndex + idx < 3 ? "rank-" + (offsetIndex + idx + 1) : ""}" style="width:20px; height:20px; font-size:10.5px;">
            ${offsetIndex + idx + 1}
          </span>
        </td>
        <td>
          <div style="font-weight:700; color:#fff; font-size:12px;">
            ${p.name}
            ${isTop ? `<span class="chip" style="margin-left:2px; background:var(--gold); color:#120a02; font-size:8.5px; padding:0 3px;">MAX</span>` : ""}
          </div>
        </td>
        <td>
          <div style="display:flex; flex-direction:column; gap:2px;">
            ${p.deckBreakdown.map(d => `
              <div style="font-size:10px; color:var(--ink-sub); display:flex; justify-content:space-between; gap:3px;">
                <span style="max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.title}</span>
                <span>
                  ${d.base.toFixed(1)}
                  <span class="cost-delta-badge ${d.delta > 0 ? "plus" : d.delta < 0 ? "minus" : "zero"}" style="padding:0 2px; font-size:8.5px;">
                    ${d.delta > 0 ? "+" + d.delta.toFixed(1) : d.delta.toFixed(1)}
                  </span>
                  → <strong style="color:var(--ink);">${d.after.toFixed(1)}</strong>
                </span>
              </div>
            `).join("")}
          </div>
        </td>
        <td class="num">
          <span class="total-cost-display" style="${isTop ? "font-size:15px; color:var(--ok);" : ""}">${p.totalAfter.toFixed(1)}</span>
        </td>
      </tr>
    `;
  }).join("");
}

function renderPostResultPlayerRows(players) {
  const sorted = getSortedPostCostPlayers(players);
  return renderPostResultPlayerRowsChunk(sorted, 0);
}

// ==========================================================================
// 主催者操作シミュレーション
// ==========================================================================
function publishDraftMatches() {
  showToast("マッチングを決定・公開しました！対戦を開始できます");
  switchState("running");
}

function simulateRoundClose() {
  showToast("全卓が確定しました。ラウンドを完了して次へ進みます");
  switchState("draft");
}

function reDrawPostCostDraft() {
  BASE_TITLES.forEach(t => {
    const d = Math.round((Math.random() * 1.0 - 0.5) * 10) / 10;
    t.delta = d;
    t.after = Math.max(0, Math.round((t.base + d) * 10) / 10);
  });
  showToast("事後コストを再抽選しました (抽選回数を更新)");
  renderArena();
}

function confirmPostCostDraft() {
  if (!postCostConfirmArmed) {
    postCostConfirmArmed = true;
    showToast("もう一度クリックすると確定・正式発表されます");
    const btn = document.getElementById("btn-post-confirm");
    if (btn) {
      btn.textContent = "本当に確定して発表する (2度押し)";
      btn.className = "btn danger";
    }
    return;
  }
  postCostConfirmArmed = false;
  showToast("事後コストを確定しました！正式発表します");
  switchState("post_result");
}

function exportMockCsv() {
  let csv = "\uFEFFタイトル,CX構成,基本コスト,事後変動,最終確定コスト\r\n";
  BASE_TITLES.forEach(t => {
    csv += `"${t.title}","${t.cx}",${t.base.toFixed(1)},${t.delta > 0 ? "+" + t.delta.toFixed(1) : t.delta.toFixed(1)},${t.after.toFixed(1)}\r\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `post_cost_S2026_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSVファイルをダウンロードしました");
}

// ==========================================================================
// 初期化
// ==========================================================================
window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const stateParam = urlParams.get("state");
  const playersParam = urlParams.get("players");

  if (playersParam === "16") {
    currentPlayers = 16;
    const btn8 = document.getElementById("btn-p8");
    const btn16 = document.getElementById("btn-p16");
    if (btn8) btn8.classList.remove("active");
    if (btn16) btn16.classList.add("active");
    const pChip = document.getElementById("participant-count-chip");
    if (pChip) pChip.textContent = "16名参加 (8卓)";
  }

  if (stateParam && ["running", "draft", "post_draft", "post_result"].includes(stateParam)) {
    currentState = stateParam;
  }

  switchState(currentState);
});
</script>
