const longNames=['星降る島のアオ','波打ち際のナギさん','琥珀色のカード職人','紫苑のデッキ研究会','春風を待つハル','港町のミナト選手','柚子畑の見習い店長','陸風にのるリク','空色の対戦記録係','林道を歩くリン','永久機関のトワさん','海峡横断のカイ','真夜中のマオ選手','零時のデッキ調整班','水面を渡るスイ','連勝祈願のレンさん'];
const longTitles=['痛いのは嫌なので防御力に極振りしたいと思います。','ソードアート・オンライン オルタナティブ ガンゲイル・オンライン','とある魔術の禁書目録／とある科学の超電磁砲','プロジェクトセカイ カラフルステージ！ feat. 初音ミク','ラブライブ！虹ヶ咲学園スクールアイドル同好会','かぐや様は告らせたい～天才たちの恋愛頭脳戦～','ダンジョンに出会いを求めるのは間違っているだろうか','ラブライブ！スクールアイドルフェスティバル2'];
const shortTitles=['防振り','ガンゲイル','とある魔術／科学','プロジェクトセカイ','虹ヶ咲学園','かぐや様','ダンまち','スクフェス2'];
const cxTypes=['8宝','4扉4門','8電源','4枝4宝','8門','4本4扉'];
const cxFor=(i,slot)=>cxTypes[(i+slot)%cxTypes.length];
let fullField=false;
function setupField(full){
 fullField=full;
 names.splice(0,names.length,...(full?longNames.slice(0,tables*2):ordinary.names));
 titles.splice(0,titles.length,...(full?longTitles:ordinary.titles));
 decks.splice(0,decks.length,...(full?names.map((_,i)=>[0,1,2,3].map((offset)=>(i+offset*3)%titles.length)):ordinary.decks));
}
// 勝数の差が小さい未対戦者を優先。公開情報は確定した卓から集計する。
function lateRound(){
 const scores=names.map(()=>0), used=names.map(()=>new Set()), met=new Set(), history=[];
 const key=(a,b)=>[Math.min(a,b),Math.max(a,b)].join('-');
 for(let r=0;r<5;r++){
  const sorted=names.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]||a-b);
  function pair(queue){
   if(!queue.length)return [];
   const [a,...rest]=queue;
   for(const b of rest){if(met.has(key(a,b)))continue;const tail=pair(rest.filter(i=>i!==b));if(tail)return [[a,b],...tail]}
   return null;
  }
  const pairs=pair(sorted);
  const choose=i=>{const order=[0,1,2,3].map(k=>(k+r)%4);if(i%5===0&&r===3)order.unshift(0,1);return order.find(s=>!used[i].has(s))};
  const matches=pairs.map(([a,b],j)=>{
   const [w,l]=scores[a]>scores[b]||scores[a]===scores[b]&&(j+r)%2?[b,a]:[a,b];
   const winSlot=choose(w),loseSlot=choose(l);
   const draw=r===3&&scores[w]===3;met.add(key(a,b));
   if(!draw){used[w].add(winSlot);scores[w]++}
   return [w,l,winSlot,loseSlot,draw];
  });
  if(r===4)return {history,live:matches};history.push(...matches);
 }
}
function showDecks(i){
 const {seen}=record(i);detailTitle.textContent=names[i]+'の登録デッキ';
 detailRows.innerHTML=[...seen].map(([slot,used])=>'<p><span>'+(used?'<s>':'')+titles[decks[i][slot]]+(used?'</s>':'')+'</span><em>'+cxFor(i,slot)+'</em></p>').join('')+'<p>？　未公開</p>'.repeat(4-seen.size);
 detail.showModal();
}
function fullRow(i,pos){
 const {w,l,d,seen}=record(i);
 const slots=[...seen].map(([slot,used])=>{
 const title=decks[i][slot],label=shortTitles[title];
 return '<span class="deck" title="'+titles[title]+'（'+cxFor(i,slot)+'）"><span class="abbr">'+(used?'<s>':'')+label+(used?'</s>':'')+'</span><em>'+cxFor(i,slot)+'</em></span>';
 }).join('')+'<span class="deck back">？</span>'.repeat(4-seen.size);
 return '<div class="rankrow"><span class="rankno">'+pad(pos+1)+'</span><div><div class="personline"><button class="name" onclick="showDecks('+i+')">'+names[i]+'</button><span class="score">'+w+'−'+l+'−'+d+'</span></div><div class="decks">'+slots+'</div></div></div>';
}

let pairings,phase,drawCount,costCount,delta,confirmed,armed,running=false,seconds=2100,lastStart=2100,until=0,roundNo=2,finalTime='';
const fmt=n=>n.toFixed(1), pad=n=>String(n).padStart(2,'0'), clockText=n=>pad(Math.floor(n/60))+':'+pad(n%60);
function loadScene(n){
 otherDelta=catalog.map((_,i)=>(i%11-5)/10);phase=n;roundNo=2;pairings=second.map(x=>[...x]);drawCount=1;costCount=1;delta=[...initialDelta];confirmed=n===1?tables/2:0;armed=false;
 seconds=n===1?18*60+42:2100;lastStart=2100;running=n===1;until=Date.now()+seconds*1000;finalTime='16:42';
 if(fullField){const late=lateRound();phase=1;roundNo=5;historyRounds=late.history;pairings=late.live;confirmed=tables/2;seconds=4*60+37;running=true;until=Date.now()+seconds*1000}
 render()
}
function btn(label,action,disabled=false,primary=false){return '<button onclick="'+action+'" '+(disabled?'disabled ':'')+'class="'+(primary?'primary':'')+'">'+label+'</button>'}
function chart(){
 let lines='';for(let k=0;k<25;k++){let d='';for(let j=0;j<=200;j++){const t=j*Math.PI/100,r=(13+k*6.6)*(1+.09*Math.cos(3*t+.6)+.09*Math.sin(5*t+k*.035)+.045*Math.cos(7*t));d+=(j?'L':'M')+(246+Math.cos(t)*r*1.37+Math.sin(t)*r*.30).toFixed(1)+' '+(120+Math.sin(t)*r*.84-Math.cos(t)*r*.36).toFixed(1)}lines+='<path d="'+d+'Z" stroke="'+(k%5?'#526e97':'#819fc4')+'" stroke-width="'+(k%5?.75:1.15)+'"/>'}
 return '<svg class="chart" viewBox="0 0 430 270" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 0H30M0 0V30" stroke="#466083" fill="none" stroke-width=".75"/></pattern></defs><rect width="430" height="270" fill="url(#grid)"/><g fill="none">'+lines+'</g><g stroke="#c1d4ec" fill="none"><circle cx="246" cy="120" r="6"/><path d="M233 120h26m-13-13v26"/></g></svg>'
}
const art=chart();
function hero(){
 const post=phase>=3,draft=phase===2||phase===3;
 let middle,foot;
 if(!post){middle='<div><p class="clocklabel">ラウンド残り時間</p><input aria-label="残り時間（分:秒）" id="clock" class="clock" maxlength="5" value="'+clockText(seconds)+'" '+(running?'readonly':'')+'></div>';
 foot='<div class="tools">'+btn(running?'STOP':'START','timerToggle()')+btn('RESET','resetClock()',running)+'<span>'+(running?'計測中':'表示を直接編集')+'</span></div>'}
 else if(phase===3){middle='<div><p class="clocklabel">事後コストの変動範囲</p><div class="herovalue">±0.5</div></div>';foot='<p class="heroNote">0.1刻み　／　抽選 '+costCount+'回目</p>'}
 else{const best=costOrder()[0];middle='<div><p class="clocklabel">事後合計 1位　／　<span class="resultname">'+names[best]+'</span></p><div class="herovalue">'+fmt(total(best))+'<small>事後合計</small></div></div>';foot='<p class="heroNote">抽選 '+costCount+'回目　／　'+finalTime+' 確定</p>'}
 return '<section class="hero">'+art+'<div class="stage"><span class="tag '+(draft?'draft':'live')+'"><i class="dot"></i>'+['','対戦中','公開前','事後コスト下書き','事後コスト発表'][phase]+'</span><span class="round">'+(post?'大会終了':'第 '+pad(roundNo)+' ラウンド')+'</span></div>'+middle+foot+'</section>'
}
let historyRounds=[];
function matches(){return phase>=3?historyRounds:[...historyRounds,...(phase===1?pairings.slice(0,confirmed):[])]}
function record(i){let w=0,l=0,d=0,seen=new Map();for(const [a,b,ad,bd,draw] of matches()){if(draw){if(i===a||i===b){d++;const slot=i===a?ad:bd;if(!seen.has(slot))seen.set(slot,false)}continue}if(i===a){w++;seen.set(ad,true)}if(i===b){l++;if(!seen.has(bd))seen.set(bd,false)}}return {w,l,d,seen}}
function total(i){return decks[i].reduce((v,t)=>v+base[t]+delta[t],0)}
function costOrder(){return names.map((_,i)=>i).sort((a,b)=>Math.round((total(b)-total(a))*10)||names[a].localeCompare(names[b],'ja'))}
function rankHeaders(cost){
 const heading=range=>'<div class="rankcap"><span>'+range+'</span><span>参加者'+(cost?'':'・登録デッキ')+'</span><span>'+(cost?'事後合計':'勝−負−分')+'</span></div>';
 return sixteen?'<div class="rankheads">'+heading('1–8位')+heading('9–16位')+'</div>':heading('順位');
}
function rankings(){const cost=phase===4;
 const ids=cost?costOrder():names.map((_,i)=>i).sort((a,b)=>record(b).w-record(a).w||names[a].localeCompare(names[b],'ja'));
 return '<section class="panel '+(cost?'costRank':'')+'"><div class="head"><h2>'+(cost?'事後コスト順位':'勝敗ランキング')+'</h2><small>'+(cost?'事後合計の高い順':phase===3?'最終結果':'確定した対戦のみ')+'</small></div>'+rankHeaders(cost)+'<div class="ranklist">'+ids.map((i,pos)=>{if(fullField&&!cost)return fullRow(i,pos);const {w,l,seen}=record(i);let chips=[...seen].map(([slot,used])=>'<span class="deck">'+(used?'<s>':'')+titles[decks[i][slot]]+(used?'</s>':'')+'</span>').join('')+'<span class="deck back" aria-label="未公開">？</span>'.repeat(3-seen.size);
 return '<div class="rankrow"><span class="rankno">'+pad(pos+1)+'</span><div><div class="name">'+names[i]+'</div><div class="decks">'+(cost?'基本合計 '+fmt(decks[i].reduce((s,t)=>s+base[t],0)):chips)+'</div></div><span class="score">'+(cost?fmt(total(i)):w+'−'+l+'−0')+'</span></div>'}).join('')+'</div><div class="legend">'+(cost?'同点は参加者名順':fullField?'<span><s>使用済み</s>　／　？ 未公開</span><span>名前を押して正式名を表示</span>':'<span><s>タイトル</s>　勝利で使用済み</span><span><b class="deck back">？</b>　未公開</span>')+'</div></section>'
}
function matching(){let draft=phase===2;return '<section class="panel"><div class="head"><h2>対戦組み合わせ</h2><small>'+(draft?'抽選 <b>'+drawCount+'</b> 回目':'確定 <b>'+confirmed+' / '+tables+'</b> 卓')+'</small></div><div class="matchlist">'+pairings.map(([a,b],j)=>'<div class="match"><span class="tableNo">'+pad(j+1)+'<small>卓</small></span><strong>'+names[a]+'</strong><i class="versus">vs.</i><strong>'+names[b]+'</strong><span class="badge '+(!draft&&j<confirmed?'ok':!draft&&j===confirmed?'wait':'')+'">'+(draft?'下書き':j<confirmed?'確定':j===confirmed?'承諾待ち':'未報告')+'</span></div>').join('')+'</div><div class="bar"><span class="dim">進行状況</span><div class="actions">'+(draft?btn('抽選','drawPair()',drawCount>0)+btn('再抽選','drawPair()',!drawCount)+btn('決定・公開','publish()',!drawCount,true):btn('ラウンド終了','finishRound()',confirmed<tables,true))+'</div></div></section>'}
function costs(){return '<section class="panel"><div class="head"><h2>タイトル別コスト</h2><small>持ち込み <b>8</b> タイトル</small></div><div class="costcap"><span>タイトル</span><span>基本</span><span>増減</span><span>事後</span></div><div class="costlist">'+titles.map((t,i)=>'<div class="costrow"><strong>'+(fullField?shortTitles[i]:t)+'</strong><span>'+fmt(base[i])+'</span><span class="'+(delta[i]>0?'up':'down')+'">'+(delta[i]>=0?'+':'−')+fmt(Math.abs(delta[i]))+'</span><span>'+fmt(base[i]+delta[i])+'</span></div>').join('')+'</div><div class="bar"><span class="dim">'+(phase===3?'発表前の下書き':'確定済み')+'</span><div class="actions">'+(phase===3?btn('抽選','drawCost()',costCount>0)+btn('再抽選','drawCost()',!costCount)+btn(armed?'もう一度押して確定':'確定','seal()',!costCount,true):btn('全タイトルをCSV出力','exportCsv()'))+'</div></div></section>'}
function render(){document.body.classList.toggle('full',fullField&&phase!==4);document.querySelector('#report').hidden=phase!==1||confirmed===tables;work.className='work'+(phase>=3?' post':'');work.innerHTML='<div class="left">'+hero()+(phase>=3?costs():matching())+'</div>'+rankings();scenes.value=fullField&&phase===1?5:phase;const c=document.querySelector('#clock');if(c){c.classList.toggle('zero',seconds===0);c.onkeydown=e=>{if(e.key==='Enter'&&!running)timerToggle()}}}
function timerToggle(){if(running){seconds=Math.max(0,Math.ceil((until-Date.now())/1000));running=false}else{const c=document.querySelector('#clock'),m=/^(\d{1,2})(?::([0-5]\d))?$/.exec(c.value.trim());if(!m){c.setCustomValidity('分:秒 または分で入力してください');c.reportValidity();c.oninput=()=>c.setCustomValidity('');return}seconds=Number(m[1])*60+Number(m[2]||0);if(seconds===0)return;lastStart=seconds;until=Date.now()+seconds*1000;running=true}render()}
function resetClock(){seconds=lastStart;render()}
setInterval(()=>{if(!running)return;seconds=Math.max(0,Math.ceil((until-Date.now())/1000));if(!seconds){running=false;render()}else document.querySelector('#clock').value=clockText(seconds)},240);
function drawPair(){drawCount++;if(roundNo===2)pairings=(drawCount%2?second:alternateSecond).map(x=>[...x]);else if(drawCount>1)pairings.push(pairings.shift());render()}
function publish(){phase=1;confirmed=0;seconds=lastStart=2100;running=false;render()}
function finishRound(){historyRounds.push(...pairings);if(roundNo===3||fullField){phase=3;costCount=0;delta=Array(8).fill(0)}else{roundNo++;phase=2;drawCount=0;pairings=(historyRounds.some(([a,b])=>a===0&&b===3)?alternateThird:third).map(x=>[...x])}running=false;seconds=lastStart=2100;render()}
function drawCost(){otherDelta=catalog.map(()=>Math.floor(Math.random()*11)/10-.5);delta=titles.map(()=>Math.floor(Math.random()*11)/10-.5);costCount++;armed=false;render()}
function seal(){if(!costCount)return;if(armed){phase=4;finalTime=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}else armed=true;render()}
function exportCsv(){const csv='\ufeffタイトル,基本,増減,事後\r\n'+catalog.map((t,j)=>{const i=titles.indexOf(t),b=i<0?2:base[i],d=i<0?otherDelta[j]:delta[i];return [t,fmt(b),fmt(d),fmt(b+d)].join(',')}).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='事後コスト.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function scene(n){setupField(n===5);historyRounds=n>=3?[...first,...second,...third]:first.slice();loadScene(n)}
scenes.onchange=()=>{const u=new URL(location.href);u.searchParams.set('state',scenes.value);history.replaceState({},'',u);scene(Number(scenes.value))};
const initial=Number(new URLSearchParams(location.search).get('state'));scene([1,2,3,4,5].includes(initial)?initial:1);
</script></body></html>
