nt:bold 22rem Consolas,monospace;color:var(--muted)}.leading .place,.accent{color:var(--sea)}.name{font-weight:700}.deck{border-left:3rem solid #72b9b1;padding-left:6rem;display:grid}.deck.used{border-color:#8c9ca4}.deck.used .short:first-child{text-decoration:line-through;text-decoration-color:#9cabac}.cx{font-size:20rem;color:#afc8ca}.secret{color:#8ea8ae;font-size:20rem;display:flex;align-items:center;gap:7rem}.secret:before{content:"";width:10rem;height:15rem;border:1rem solid #779098;transform:rotate(-8deg);background:repeating-linear-gradient(45deg,transparent 0 3rem,#536e76 3rem 4rem)}.foot{border-top:1rem solid var(--line);padding-top:8rem}.controls{gap:10rem;font-size:17rem}.controls a{color:var(--muted);text-underline-offset:4rem}.primary{background:var(--sea);border-color:transparent;color:#0d3436;font-weight:700}.primary:hover{background:#b4f4e9}.post{grid-template-columns:1fr 1.18fr}.costs{display:grid;grid-template-rows:34rem repeat(var(--rows),minmax(0,1fr))}.costrow{display:grid;grid-template-columns:50rem minmax(0,1fr) 128rem 120rem 132rem;gap:10rem;align-items:center;padding:0 12rem;border-bottom:1rem solid var(--line)}.costrow.title{grid-template-columns:minmax(0,1fr) 108rem 85rem 85rem 90rem}.costrow:last-child{border-bottom:0}.costrow strong{color:var(--sea);font-size:26rem}.costrow .num{font-size:22rem}.eight .table{padding:12rem 16rem;gap:14rem}.eight .seat{gap:7rem}.eight .tblhead strong{font-size:27rem}.eight .seat b{font-size:25rem}.eight .rk .place{font-size:27rem}.eight .deck{padding-block:4rem}dialog{width:650rem;background:var(--surface);color:var(--ink);border:1rem solid #639287;border-radius:12rem;padding:32rem;font-size:24rem}dialog::backdrop{background:#05161bd9}dialog h2{font-size:28rem;margin:0 0 14rem}dialog p{overflow-wrap:anywhere}dialog button{font-size:20rem}#dlgfoot{display:flex;gap:10rem;justify-content:flex-end}

<script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
const n=q.get('players')==='16'?16:8,total=n/2;
let state=[1,2,3,4,5].includes(+q.get('state'))?+q.get('state'):1;
const titles=["アイドルマスター シャイニーカラーズ","あおぎり高校","アサルトリリィ","アズールレーン","痛いのは嫌なので防御力に極振りしたいと思います。","【推しの子】","怪獣８号","刀語","Key","キルラキル","CLANNAD","彼女、お借りします","anemoi","リコリス・リコイル","境界のRINNE","神様になった日"];
const names=["なぎ","風待ちのペンギンさん","しおり","ルカ","海辺のカード研究員","ミナト","ゆず","こはく","アオ","しまねこ探検隊隊長","みずき","灯台守のはるかさん","つばさ","うみ","ソラ","かもめ"];
const cx=["8扉","8宝","4門4本","4扉4宝"],base=titles.map((_,i)=>10+(i*7)%23);
let delta=titles.map((_,i)=>(i*7+3)%11-5),round=state===1?2:state===2?3:5,seconds=state===5?168:2100,running=state===1,draw=state===3||state===4?1:0;
let roster=Array.from({length:n},(_,i)=>({i,name:names[i],ids:[0,3,7,10].map(d=>(i*5+d)%titles.length),won:0,lost:0,seen:[],spent:[],opps:[]}));
function use(p,slot,win){if(!p.seen.includes(slot))p.seen.push(slot);if(win&&!p.spent.includes(slot))p.spent.push(slot)}
function pick(p){return [0,1,2,3].find(k=>!p.seen.includes(k))??[0,1,2,3].find(k=>!p.spent.includes(k))??0}
function record(a,b,flip=false,k=pick(roster[a]),j=roster[b]?pick(roster[b]):null){let p=roster[a],v=roster[b];use(p,k,!flip);p[flip?'lost':'won']++;if(v){use(v,j,flip);v[flip?'won':'lost']++;p.opps.push(b);v.opps.push(a)}return [k,j]}
function setupHistory(){
 for(let r=0;r<round-1;r++)for(let i=0;i<total;i++){
   const odd=2*((i+r)%total)+1;
   record(2*i,odd,r===1||r===3&&i%2===1);
 }
}
setupHistory();
let matches=[];
const withdrawn=state===1?n-1:null;
function pairings(shuffle=false,live=false){let ids=roster.filter(p=>p.i!==withdrawn&&p.spent.length<4).map(p=>p.i);if(shuffle){for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}
 matches=[];for(let i=0;i<ids.length;i+=2){const a=ids[i],b=ids[i+1],idx=i/2;let status=!live?'下書き':b===undefined?'了解待ち':state===5?'確定':idx===1?'承諾待ち':idx===2?'対戦中':'確定';let slots=status==='確定'?record(a,b,idx%2===1):[];matches.push({a,b,status,slots,flip:idx%2===1})}}
pairings(false,state===1||state===5);
const sum=(p,after=false)=>p.ids.reduce((s,i)=>s+base[i]+(after?delta[i]:0),0),fmt=x=>(x/10).toFixed(1),sign=x=>(x>0?'+':'')+fmt(x),rate=p=>p.won/(p.won+p.lost||1),omw=p=>p.opps.reduce((v,i)=>v+Math.max(1/3,rate(roster[i])),0)/(p.opps.length||1),pct=v=>Math.round(v*100)+'%',pad=i=>String(i).padStart(2,'0');
const short=(s,cls='')=>'<span class="short '+cls+'">'+s+'</span>',btn=(s,id,primary=false)=>'<button data-act="'+id+'" class="'+(primary?'primary':'')+'">'+s+'</button>';
function panel(h,meta,body,note){return '<section class="panel"><div class="panelhead"><h2>'+h+'</h2><small>'+meta+'</small></div>'+body+'<div class="note">'+note+'</div></section>'}
function seat(id,m,k){if(id===undefined)return '<div class="seat"><b>本人の操作</b><small>'+(m.status==='確定'?'了解済み':m.status==='下書き'?'公開後に了解':'デッキを選んで了解')+'</small></div>';let p=roster[id],done=m.status==='確定',info=done?(k===Number(m.flip)?'勝 · ':'敗 · ')+titles[p.ids[m.slots[k]]]:m.status==='下書き'?'使用デッキ未定':'使用デッキ非公開';return '<div class="seat">'+short(p.name,'name')+short(info,'deckinfo')+'</div>'}
function tables(){return '<div class="tables">'+matches.map((m,i)=>'<article class="table"><div class="tblhead"><strong>'+(m.b===undefined?'不戦勝':'第 '+pad(i+1)+' 卓')+'</strong><span class="status '+({'確定':'ok','承諾待ち':'wait','了解待ち':'bye'}[m.status]||'')+'">'+m.status+'</span></div><div class="pair">'+seat(m.a,m,0)+'<i>'+(m.b===undefined?'':'vs')+'</i>'+seat(m.b,m,1)+'</div></article>').join('')+'</div>'}
function rank(){let order=roster.slice().sort((a,b)=>b.won-a.won||rate(b)-rate(a)||sum(a)-sum(b)||omw(b)-omw(a)||a.i-b.i);
return '<div class="ranking"><div class="rk thead">'+['順位','参加者','勝–敗','勝率','登録計','OMW','デッキ 1','デッキ 2','デッキ 3','デッキ 4'].map(x=>'<span>'+x+'</span>').join('')+'</div>'+order.map((p,i)=>'<div class="rk '+(!i?'leading':'')+'"><span class="place">'+pad(i+1)+'</span>'+short(p.name+(p.i===withdrawn?'（棄権）':''),'name')+'<span class="num">'+p.won+'–'+p.lost+'</span><span class="num">'+pct(rate(p))+'</span><span class="num">'+fmt(sum(p))+'</span><span class="num">'+pct(omw(p))+'</span>'+Array.from({length:4},(_,k)=>{let slot=p.seen[k];return slot===undefined?'<span class="secret">未公開</span>':'<div class="deck '+(p.spent.includes(slot)?'used':'')+'">'+short(titles[p.ids[slot]])+((state===5||n===8)?short(cx[p.ids[slot]%4]+' · '+fmt(base[p.ids[slot]]),'cx'):'')+'</div>'}).join('')+'</div>').join('')+'</div>'}
const brought=Array.from(new Set(roster.flatMap(p=>p.ids))).sort((a,b)=>a-b);
function postTables(){let order=roster.slice().sort((a,b)=>sum(b,true)-sum(a,true)||a.name.localeCompare(b.name,'ja'));
function costList(head,rows,cls=''){return '<div class="costs" style="--rows:'+rows.length+'"><div class="costrow thead '+cls+'">'+head.map(x=>'<span>'+x+'</span>').join('')+'</div>'+rows.join('')+'</div>'}
return panel('事後合計ランキング',n+' 人',costList(['順位','参加者','登録合計','増減','事後合計'],order.map((p,i)=>'<div class="costrow '+(!i?'leading':'')+'"><span class="place">'+pad(i+1)+'</span><div class="entrant">'+short(p.name,'name')+'<span class="meter" aria-hidden="true"><i style="width:'+100*sum(p,true)/sum(order[0],true)+'%"></i></span></div><span class="num">'+fmt(sum(p))+'</span><span class="num '+(sum(p,true)<sum(p)?'negative':sum(p,true)>sum(p)?'positive':'')+'">'+sign(sum(p,true)-sum(p))+'</span><strong class="num">'+fmt(sum(p,true))+'</strong></div>')),'事後合計の高い順。同点の場合は名前順。')+panel('持ち込みタイトル',brought.length+' 種',costList(['タイトル','CX構成','基本','増減','事後'],brought.map(i=>'<div class="costrow title">'+short(titles[i])+'<span>'+cx[i%4]+'</span><span class="num">'+fmt(base[i])+'</span><span class="num '+(delta[i]<0?'negative':delta[i]>0?'positive':'')+'">'+sign(delta[i])+'</span><strong class="num">'+fmt(base[i]+delta[i])+'</strong></div>'),'title'),'今大会の登録分を表示');}
function paint(){let post=state===3||state===4,done=matches.filter(m=>m.status==='確定').length;
const byeCount=matches.filter(m=>m.b===undefined).length,duels=matches.length-byeCount,active=duels*2+byeCount;
document.body.className=(n===8?'eight':'sixteen')+(state===5?' final':'')+(state===4?' announced':'');document.documentElement.style.setProperty('--n',n);$('people').textContent=(!post&&active!==n)?active+'人参加（'+n+'人登録）':n+'人登録';
$('headline').innerHTML='<div class="eyebrow">'+(post?'AFTER COST ／ 事後集計':'ROUND '+pad(round)+' / 05　 大会進行')+'</div><h1>'+({1:'ラウンド進行中',2:'マッチング下書き',3:'事後コスト下書き',4:'事後コスト発表',5:'最終ラウンド'}[state])+'</h1><p>'+(post?(state===3?'第 '+draw+' 回抽選　／　確定前のプレビュー':'登録した4デッキの事後合計で集計'):state===2?'組み合わせの公開前':'使用デッキは対戦結果の確定後に公開')+'</p>';
$('metric').innerHTML='<div class="eyebrow">'+(state===4?'最高事後合計':post?'変動範囲':'ラウンド残り時間')+'</div><b class="big" id="clock">'+(state===4?fmt(Math.max(...roster.map(p=>sum(p,true)))):post?'±0.5':clock())+'</b>';
$('progress').innerHTML='<div class="eyebrow">'+(post?'持ち込みタイトル':state===2?'組み合わせ候補':'結果確定')+'</div><b class="big">'+(post?brought.length+'<small> 種</small>':state===2?matches.length+'<small> '+(byeCount?'件':'卓')+'</small>':done+'<small> / '+matches.length+' '+(byeCount?'件':'卓')+'</small>')+'</b>'+(!post&&state!==2?'<div class="bars">'+matches.map(m=>'<i class="'+(m.status==='確定'?'on':'')+'"></i>').join('')+'</div>':'');
$('board').className='board'+(post?' post':'');$('board').innerHTML=post?postTables():panel(state===2?'組み合わせ案':'対戦卓',(byeCount?'通常'+duels+'卓 ＋ 不戦勝'+byeCount+'人':duels+' 卓'),tables(),withdrawn!==null?'第1ラウンド終了後に棄権　'+roster[withdrawn].name:state===2?'決定すると参加者に公開されます':'使用デッキは各卓の名前の下に表示')+panel('大会順位','登録デッキ 4 個 ／ 人',rank(),'順位基準　 勝ち数（多） → 勝率（高） → 登録合計コスト（低） → OMW%（高）');
$('legend').textContent=post?'しまWS大会　／　大会終了':'デッキ欄　　斜線のカードは未公開　／　取り消し線は勝利で使用済み';
$('controls').innerHTML='<a href="#repair" target="_blank" rel="noopener">大会進行修正 ↗</a>'+(!post&&state!==2&&done<matches.length?btn('模擬端末 ↗','terminal'):'')+(post?'<button disabled title="全行書き出しの配置見本">全行 CSV ↓</button>':'')+(state===2?btn('再抽選','pair')+btn('決定して公開','publish',true):state===3?btn('再抽選','roll')+btn('確定して発表','announce',true):state===4?'':btn(running?'一時停止':'再開','timer')+btn('35:00 に戻す','reset')+btn('ラウンド終了','end',true));
document.querySelectorAll('.short').forEach(el=>{if(el.scrollWidth>el.clientWidth){el.classList.add('cut');el.tabIndex=0;el.title=el.textContent;el.setAttribute('role','button')}})}
function clock(){return pad(Math.floor(seconds/60))+':'+pad(seconds%60)}
setInterval(()=>{if(running&&seconds>0){seconds--;if($('clock'))$('clock').textContent=clock()}},1000);
function modal(title,message,actions=''){$('dlgtitle').textContent=title;$('dlgbody').textContent=message;$('dlgfoot').innerHTML=btn('閉じる','close')+actions;if(!$('dialog').open)$('dialog').showModal()}
// 参加者側の選択だけを別窓で再現し、確定した結果を投影画面に返す。
function openTerminal(){
 const terminal=window.open('','shima-participant','popup,width=620,height=660');
 if(!terminal){modal('模擬端末を開けません','このモックのポップアップを許可して、もう一度開いてください。');return}
 const doc=terminal.document;
 doc.documentElement.lang='ja';doc.title='参加者の模擬端末｜しまWS大会';
 doc.head.innerHTML='<meta name="viewport" content="width=device-width,initial-scale=1"><title>参加者の模擬端末</title><style>*{box-sizing:border-box}body{margin:32px auto;padding:0 20px;max-width:560px;font:18px/1.5 Meiryo,sans-serif;background:#f2f6f2;color:#13383e}h1{font-size:26px}label,select,button{display:block;width:100%;font:inherit;margin:10px 0}select,button{padding:8px;border:1px solid #78908e;border-radius:6px}button{background:#155b59;color:white;cursor:pointer}small{color:#345}</style>';
 function terminalView(index){
  let pending=matches.map((m,i)=>({m,i})).filter(({m})=>m.status!=='確定');
  if(!pending.length||![1,5].includes(state)){doc.body.innerHTML='<h1>このラウンドの操作は終了しました</h1><button>端末を閉じる</button>';doc.querySelector('button').onclick=()=>terminal.close();return}
  let {m,i}=pending.find(x=>x.i===index)||pending[0],bye=m.b===undefined,approve=m.status==='承諾待ち',p=roster[approve?m.b:m.a];
  let available=p.ids.map((id,k)=>({id,k})).filter(x=>!p.spent.includes(x.k));
  doc.body.innerHTML='<small>しまWS大会 ／ 参加者の模擬端末</small><h1>'+p.name+' さんの操作</h1><label>操作する卓<select id="table">'+pending.map(x=>'<option value="'+x.i+'" '+(x.i===i?'selected':'')+ '>'+ (x.m.b===undefined?'不戦勝':'第 '+pad(x.i+1)+' 卓')+'　'+x.m.status+'</option>').join('')+'</select></label><p>'+(bye?'不戦勝です。使用済みにする自分のデッキを選んでください。':approve?'相手の報告は「'+roster[m.flip?m.b:m.a].name+' さんの勝ち」です。自分の使用デッキを選んで承諾してください。':'自分の使用デッキと勝敗を報告してください。')+'</p><label>自分のデッキ<select id="slot">'+available.map(x=>'<option value="'+x.k+'">'+titles[x.id]+'（'+cx[x.id%4]+'）</option>').join('')+'</select></label>'+(!bye&&!approve?'<label>勝敗<select id="win"><option value="0">自分の勝ち</option><option value="1">相手の勝ち</option></select></label>':'')+'<button id="submit">'+(bye?'選んで了解':approve?'結果を承諾':'結果を報告')+'</button>'+(bye?'<button id="random">ランダムで選んで了解</button>':'');
  doc.querySelector('#table').onchange=e=>terminalView(Number(e.target.value));
  function submit(k){
   if(!matches.includes(m)||m.status==='確定'){terminalView();return}
   if(bye){m.slots=record(m.a,undefined,false,k);m.flip=false;m.status='確定'}
   else if(approve){m.slots=record(m.a,m.b,m.flip,m.firstSlot??pick(roster[m.a]),k);m.status='確定'}
   else{m.firstSlot=k;m.flip=doc.querySelector('#win').value==='1';m.status='承諾待ち'}
   paint();terminalView(i)
  }
  doc.querySelector('#submit').onclick=()=>submit(Number(doc.querySelector('#slot').value));
  if(bye)doc.querySelector('#random').onclick=()=>submit(available[Math.floor(Math.random()*available.length)].k);
 }
 terminalView();terminal.focus()
}
function roll(){delta=base.map(()=>Math.floor(Math.random()*11)-5);draw++}
document.addEventListener('click',e=>{const cut=e.target.closest('.cut');if(cut){modal('全文表示',cut.textContent);return}let act=e.target.dataset.act;if(!act)return;if($('dialog').open)$('dialog').close();switch(act){
case 'terminal':openTerminal();return;case 'timer':running=!running;break;case 'reset':seconds=2100;break;
case 'end':{let left=matches.filter(m=>m.status!=='確定').length;if(left){modal('未確定の卓があります',left+'卓の結果確定を待っています。'+(matches.some(m=>m.status==='了解待ち')?'不戦勝の参加者は自分の端末で使用済みにするデッキを選ぶか、ランダムで選んで了解します。':''));return}modal('ラウンドを終了',round>=5?'大会を終了して事後コストを抽選します。':'次のラウンドの組み合わせを抽選します。',round>=5?btn('事後コストを抽選','post',true):btn('マッチングを抽選','next',true));return}
case 'next':state=2;round++;running=false;seconds=2100;pairings(true);break;case 'pair':pairings(true);break;
case 'publish':state=round>=5?5:1;running=true;seconds=2100;matches.forEach(m=>m.status=m.b===undefined?'了解待ち':'対戦中');break;
case 'post':running=false;state=3;roll();break;case 'roll':roll();break;case 'announce':modal('事後コストを確定', 'この抽選結果を会場に発表します。確定後は再抽選できません。',btn('確定して発表','confirm-cost',true));return;case 'confirm-cost':state=4;break;case 'close':return}paint()});
document.addEventListener('keydown',e=>{if(e.target.matches('.cut')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}});
$('contours').innerHTML=Array.from({length:20},(_,i)=>{let d=Array.from({length:121},(_,j)=>{let a=j*Math.PI/60,r=1+.13*Math.cos(a*3)+.09*Math.sin(a*5+.4);return (j?'L':'M')+(565+Math.cos(a)*(55+i*15)*r).toFixed(1)+' '+(98+Math.sin(a)*(20+i*7)*r).toFixed(1)}).join(' ');return '<path d="'+d+'Z"/>'}).join('');
