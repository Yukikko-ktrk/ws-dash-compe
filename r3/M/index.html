</div><div class="clockface"><span>ラウンド残り時間</span><b id="roundClock">35:00</b></div><div class="statusblock"><div class="statrow">抽選対象<div><strong id="count"></strong><small>人</small></div></div><div class="outrow">途中棄権・対象外<span id="withdrawn"></span></div></div></section>
<section class="right"><div class="righthead"><div><h2 id="boardTitle"></h2><p id="boardMeta"></p></div><div class="counter"><span id="meterLabel">抽選卓数</span><b id="progress"></b></div></div><div id="roster"></div><div class="legend"><span class="hint">勝 - 負 - 分　／　デッキを選んで詳細</span><span><b class="mark used">✓</b>使用済み</span><span><b class="mark open">●</b>使用可</span><span><b class="mark secret">？</b>未公開</span></div></section>
</div>
<footer><div class="flow" id="steps"><span><b>01</b> 抽選</span><i></i><span><b>02</b> 下書き</span><i></i><span><b>03</b> 公開</span><i></i><span><b>04</b> ラウンド</span></div><div class="footnote"><span>主催者操作</span><div id="actions"></div></div></footer>
</main><dialog id="detail"></dialog>
<script>
const select = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const size = params.get("players") === "16" ? 16 : 8;
const pad = number => String(number).padStart(2, "0");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const labels = {used:"使用済み", open:"使用可", secret:"未公開"};
const marks = {used:"✓", open:"●", secret:"?"};
// 確定済みの対戦で公開されたデッキだけをサンプルに含める。
const publicTitles = [
  "ゆるキャン△","グランブルーファンタジー","アズールレーン","キルラキル",
  "日常","アイドルマスター シャイニーカラーズ","五等分の花嫁","東方Project",
  "怪獣８号","ログ・ホライズン","リコリス・リコイル","幻日のヨハネ -SUNSHINE in the MIRROR-",
  "ギルティクラウン","ぷよぷよ","PIXAR","痛いのは嫌なので防御力に極振りしたいと思います。"
];
const aliases = [
  "泡沫ポスト","薄明ラムネ","月面の紙芝居屋さん","霧笛パルス",
  "凪びん","六角砂時計","浮雲の手紙製作所","深海しおり",
  "夜光カヌー","紺碧の折紙飛行隊","宵まど","白雨フィルム",
  "雪片ビスケ","鉱石リボン","瑠璃色の天文郵便局","潮音ランプ"
];
const historyCodes = ["WW","LD","WL","DL","LW","WD","LL","DW"];
const entrants = aliases.slice(0, size).map((name, index) => {
  const results = [...historyCodes[index % 8]];
  const record = ["W","L","D"].map(code => results.filter(result => result === code).length);
  const decks = results.map((result, turn) => ({
    state: result === "W" ? "used" : "open",
    title: publicTitles[(index + turn * 5) % publicTitles.length]
  }));
  decks.push({state:"secret"}, {state:"secret"});
  return {id:index + 1, name, record, decks, withdrawn:index === size - 1};
});
const eligible = entrants.filter(person => !person.withdrawn);
const tableCount = Math.ceil(eligible.length / 2);
document.body.dataset.players = size;
select("withdrawn").textContent = entrants[size - 1].name;
select("count").textContent = eligible.length;

const states = {
  before:["抽選待機中","参加者を確認して抽選を開始します。","参加者一覧","登録順"],
  drawing:["組み合わせ抽選中","卓番号順に対戦カードが開きます。","対戦カード","開封中"],
  drafted:["マッチング下書き","組み合わせを確認して公開します。","対戦カード","主催者確認中"],
  published:["組み合わせ公開","指定の対戦卓へ移動してください。","対戦カード","公開済み"],
  round:["ラウンド進行中","各卓で対戦を開始してください。","対戦卓","ラウンド残り"]
};
const initial = Object.hasOwn(states, params.get("state")) ? params.get("state") : "before";
let state, pairs = [], revealed = 0, revealTimer = 0, clock = 0;

function deckButton(person) {
  const icons = person.decks.map(deck =>
    `<span class="mark ${deck.state}" aria-hidden="true" title="${labels[deck.state]}">${marks[deck.state]}</span>`
  ).join("");
  return `<button type="button" class="decks" data-person="${person.id}" aria-label="${person.name}のデッキ4枠と成績の詳細">${icons}</button>`;
}
function personLine(person) {
  return `<div class="person"><strong class="pname" title="${person.name}">${person.name}</strong><span class="record" aria-label="${person.record[0]}勝${person.record[1]}負${person.record[2]}分">${person.record.join(" - ")}</span></div>`;
}
function titleLine(person) {
  if (size === 16) return "";
  const titles = person.decks.filter(deck => deck.title).map(deck => deck.title).join(" ／ ");
  return `<button type="button" class="decktitle" data-person="${person.id}" title="${titles}" aria-label="${person.name}の公開済みデッキの詳細">${titles}</button>`;
}
function entry(person) {
  return `<article class="entry${person.withdrawn ? " withdrawn" : ""}"><span class="pid">${pad(person.id)}</span>${personLine(person)}${deckButton(person)}${titleLine(person)}</article>`;
}
function seat(person) {
  return `<div class="seat">${personLine(person)}${deckButton(person)}${titleLine(person)}</div>`;
}
function newPairs(order) {
  const result = [];
  for (let i = 0; i < order.length; i += 2) result.push(order.slice(i, i + 2));
  return result;
}
function pairKey(list) {
  return list.map(pair => pair.map(person => person.id).sort((a,b) => a-b).join(",")).sort().join("/");
}
function drawOrder() {
  const order = [...eligible];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  // 卓順・席順だけ動いた再抽選は避ける。
  if (pairs.length && pairKey(newPairs(order)) === pairKey(pairs)) {
    [order[0], order[2]] = [order[2], order[0]];
  }
  return newPairs(order);
}
function table(index, sealed = false) {
  const pair = pairs[index];
  const bye = pair.length === 1;
  const status = sealed ? "開封待ち" : bye ? "不戦勝" : ({drawing:"開封",drafted:"下書き",published:"公開済み",round:"対戦中"})[state];
  const head = `<header class="thead"><strong class="tn">第 ${pad(index + 1)} 卓</strong><span class="status">${status}</span></header>`;
  if (sealed) return `<article class="table sealed">${head}<div class="backface" aria-hidden="true"><span>✦</span></div></article>`;
  const note = ["published","round"].includes(state) ? "本人の了解待ち" : "公開後、本人が了解";
  const body = pair.map(seat).join("") + (bye ? `<div class="seat bye-note"><div class="person"><strong class="pname">対戦相手なし</strong><span class="record">${note}</span></div></div>` : "");
  return `<article class="table${bye ? " bye" : ""}${state === "drawing" ? " revealing" : ""}">${head}${body}</article>`;
}
function action(key, text, primary = false, disabled = false) {
  return `<button type="button" data-action="${key}" class="${primary ? "primary" : "secondary"}"${disabled ? " disabled" : ""}>${text}</button>`;
}
function renderActions() {
  const actions = {
    before:action("draw","抽選",true),
    drawing:action("busy","抽選中",false,true),
    drafted:action("draw","再抽選") + action("publish","決定（公開）",true),
    published:action("start","ラウンド START",true),
    round:""
  };
  select("actions").innerHTML = actions[state];
}
function updateProgress() {
  select("progress").textContent = `${pad(revealed)} / ${pad(tableCount)}`;
}
function runClock() {
  const end = Date.now() + 35 * 60 * 1000;
  function tick() {
    const seconds = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    select("progress").textContent = pad(Math.floor(seconds / 60)) + ":" + pad(seconds % 60);
    select("roundClock").textContent = select("progress").textContent; if (seconds === 0) clearInterval(clock);
  }
  tick();
  clock = setInterval(tick, 200);
}
function show(next) {
  clearTimeout(revealTimer);
  clearInterval(clock);
  state = next;
  document.body.dataset.state = state;
  const copy = states[state];
  ["stateName","caption","boardTitle","boardMeta"].forEach((id, index) => select(id).textContent = copy[index]);
  revealed = ["before","drawing"].includes(state) ? 0 : tableCount;
  select("roster").innerHTML = state === "before" ? entrants.map(entry).join("") : pairs.map((_,i) => table(i, state === "drawing")).join("");
  renderActions();
  select("meterLabel").textContent = state === "round" ? "残り時間" : "開封した卓"; select("heroTitle").textContent = state === "round" ? "対戦進行" : "マッチング"; if (state === "round") runClock(); else updateProgress();
  const url = new URL(location.href);
  url.searchParams.set("state", state);
  try { history.replaceState(null,"",url); } catch (_) { /* file: 上でURL書換が制限されても操作できる */ }
}
function draw() {
  pairs = drawOrder();
  if (reduced.matches) { show("drafted"); return; }
  show("drawing");
  function reveal() {
    const element = select("roster").children[revealed];
    element.outerHTML = table(revealed);
    revealed++;
    updateProgress();
    revealTimer = setTimeout(revealed === tableCount ? () => show("drafted") : reveal, revealed === tableCount ? 510 : 420);
  }
  revealTimer = setTimeout(reveal, 270);
}
reduced.addEventListener("change", () => {
  if (state === "drawing" && reduced.matches) show("drafted");
});
select("actions").addEventListener("click", event => {
  const key = event.target.closest("button")?.dataset.action;
  if (key === "draw" && ["before","drafted"].includes(state)) draw();
  if (key === "publish" && state === "drafted") show("published");
  if (key === "start" && state === "published") show("round");
});
const detail = select("detail");
select("roster").addEventListener("click", event => {
  const source = event.target.closest("[data-person]");
  if (!source) return;
  const person = entrants[Number(source.dataset.person) - 1];
  const rows = person.decks.map((deck, index) => `<li class="${deck.state}"><span>${pad(index + 1)}　${labels[deck.state]}</span><strong>${deck.title || "タイトル非表示"}</strong></li>`).join("");
  detail.innerHTML = `<h2 id="detailName">${person.name}</h2><p>${person.withdrawn ? "途中棄権　" : ""}${person.record[0]}勝　${person.record[1]}負　${person.record[2]}分</p><ol class="detaildecks">${rows}</ol><button type="button" autofocus>閉じる</button>`;
  detail.setAttribute("aria-labelledby","detailName");
  detail.querySelector("button").onclick = () => detail.close();
  detail.showModal();
});
detail.addEventListener("click", event => {
  if (event.target !== detail) return;
  const rect = detail.getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) detail.close();
});
// URL直行の確定状態は撮影・比較用に同じ組み合わせにそろえる。
pairs = newPairs(eligible);
if (initial === "drawing") draw(); else show(initial);

</script>
</body></html>
