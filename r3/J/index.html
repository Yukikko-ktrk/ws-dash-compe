<!DOCTYPE html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しまWS大会ダッシュボード — マッチング抽選（第3回コンペ J 案）</title>
<style>
:root{
  --jp:"BIZ UDPGothic","Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Bahnschrift","DIN Alternate","Consolas",monospace;
  --bg:#0b0d11; --surface:#13161d; --card:#1a1e27; --card2:#20252f; --edge:#2b3241; --edge2:#3d4659;
  --ink:#f1f3f6; --sub:#b4bac6; --mute:#7f8797;
  --accent:#7ca3ff; --accent-bg:#1b2540;
  --ok:#5eead4; --ok-bg:#0f2b26;
  --wait:#fbbf24; --wait-bg:#33280f;
  --ack:#c9a6ff; --ack-bg:#2a2140;
  --danger:#f87171; --danger-bg:#38181a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--ink);font-family:var(--jp)}
button,input{font-family:inherit;color:inherit}
/* 1920x1080 の固定ステージを画面に合わせて等倍率で縮小する（1280x720 でも同じ配置） */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  padding:12px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:radial-gradient(1200px 500px at 50% -80px,#1a2030 0%,var(--bg) 70%)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ell.cut{cursor:help}

/* ---------- ヘッダー（H 案と同じ） ---------- */
.top{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 14px;background:var(--surface);border:1px solid var(--edge);border-radius:12px}
.top-l,.top-r{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:.04em}
.brand i{width:5px;height:22px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.tname{font-size:20px;font-weight:700;color:var(--ink)}
.chip{font-size:15px;font-weight:700;padding:3px 10px;border-radius:7px;border:1px solid var(--edge);background:var(--card);color:var(--sub)}
.chip.rule{border-color:#3b5598;background:var(--accent-bg);color:var(--accent)}
.chip.round{border-color:#1f6b5f;background:var(--ok-bg);color:var(--ok)}
.seg{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--edge);border-radius:8px;background:#0a0c10}
.seg span{font-size:12px;color:var(--mute);padding:0 6px}
.seg button{border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:700;padding:4px 9px;border-radius:6px;cursor:pointer}
.seg button.on{background:#27304a;color:#fff}
.lnk{font-size:14px;font-weight:700;color:var(--sub);text-decoration:none;padding:5px 11px;border:1px solid var(--edge);border-radius:7px;background:var(--card);cursor:pointer}
.lnk:hover{color:#fff;border-color:var(--accent)}

/* ---------- 主催者ボタン（控えめ） ---------- */
.btn{font-size:15px;font-weight:700;height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--edge2);background:transparent;
  color:var(--sub);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){color:#fff;border-color:var(--accent)}
.btn.pri{color:var(--accent);border-color:#3b5598;background:var(--accent-bg)}
.btn.armed{color:#1a1205;background:var(--wait);border-color:var(--wait)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{font-size:12px;color:var(--mute);letter-spacing:.08em;flex:none}
.hint{font-size:14px;color:var(--mute)}
body.hideorg .org{visibility:hidden}

/* ================= マッチング画面 ================= */
#match{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#round{flex:1;min-height:0;display:none;grid-template-columns:584px minmax(0,1fr);gap:12px}
body.inround #match{display:none}
body.inround #round{display:grid;animation:fadein .35s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 見出し帯 */
.hero{flex:none;height:84px;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:28px;align-items:center;
  padding:0 20px;border:1px solid var(--edge);border-radius:12px;background:linear-gradient(180deg,#191e2a,#11141a)}
.hero::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.h-ttl{display:flex;align-items:center;gap:16px;white-space:nowrap}
.h-ttl .r{font-family:var(--num);font-size:44px;font-weight:700;letter-spacing:.03em;line-height:1;text-shadow:0 0 26px rgba(124,163,255,.45)}
.h-ttl .r small{font-size:22px;color:var(--mute);font-weight:400}
.h-ttl .t{font-size:30px;font-weight:700;letter-spacing:.04em}
.h-mid{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.steps{display:flex;align-items:center;gap:8px;white-space:nowrap}
.steps .st{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:700;line-height:28px;color:var(--mute);padding:1px 12px 1px 4px;border-radius:16px;border:1px solid transparent}
.steps .st b{font-family:var(--num);width:24px;height:24px;line-height:24px;font-size:17px;text-align:center;border-radius:50%;background:var(--edge);color:var(--sub)}
.steps .st.done{color:var(--sub)}
.steps .st.done b{background:var(--ok-bg);color:var(--ok)}
.steps .st.on{color:#fff;border-color:#3b5598;background:var(--accent-bg)}
.steps .st.on b{background:var(--accent);color:#0b1020}
.steps .ar{color:var(--edge2);font-size:16px}
.msg{font-size:20px;line-height:28px;color:var(--sub);white-space:nowrap}
.msg b{color:var(--ink)}
.msg.draft b{color:var(--wait)} .msg.pub b{color:var(--ok)} .msg.draw b{color:var(--accent)}
.h-tm{display:flex;align-items:center;gap:14px;white-space:nowrap}
.h-tm .k{font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.1em;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.h-tm .s{font-size:13px;letter-spacing:.04em;padding:1px 8px;border-radius:5px;border:1px solid var(--wait);color:var(--wait);background:var(--wait-bg)}
.h-tm .v{font-size:60px;font-weight:700;line-height:1;letter-spacing:.04em;color:#fff;text-shadow:0 0 26px rgba(124,163,255,.45)}

/* 抽選盤 */
#board{flex:1;min-height:0;position:relative;
  --nmh:32px;--fnm:24px;--frec:24px;--fdk:20px;--bw:70px;--pad:6px 10px;--gap:3px;--fno:26px;--fvs:20px;--fq:72px;--persp:3200px}
#board.big{--nmh:54px;--fnm:30px;--frec:30px;--fdk:24px;--bw:88px;--pad:14px 16px;--gap:8px;--fno:38px;--fvs:26px;--fq:130px;--persp:7000px}
#frames{position:absolute;inset:0}
#board.big .byeinfo p,#board.big #note li,#board.big #note h4{font-size:22px;line-height:1.7}
/* 卓の枠 */
.tb{position:absolute;border:1px solid var(--edge);border-radius:12px;background:var(--surface);overflow:hidden;
  transition:opacity .4s,border-color .3s,box-shadow .3s}
.tb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--edge2);transition:background .3s}
.tb.draft{border-style:dashed}
.tb.pub::before{background:var(--accent)}
.tb.bye::before{background:var(--ack)}
.tb.ghost{opacity:.5}
.tb.hot{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,163,255,.55),0 0 46px rgba(124,163,255,.35)}
.tb.hot::before{background:var(--accent)}
.tb.bye.hot{border-color:var(--ack);box-shadow:0 0 0 2px rgba(201,166,255,.55),0 0 46px rgba(201,166,255,.35)}
.tb.hit{animation:land .8s ease-out}
@keyframes land{0%{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 60px rgba(124,163,255,.8)}100%{box-shadow:0 0 0 0 rgba(124,163,255,0),0 0 0 rgba(124,163,255,0)}}
[data-phase=before] .tb{opacity:0}
.mid{position:absolute;left:12px;right:8px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;white-space:nowrap}
.mid .no{font-size:20px;font-weight:700;color:var(--sub);line-height:1}
.mid .no b{font-family:var(--num);font-size:var(--fno);color:var(--ink);margin-left:5px}
.tb.bye .mid .no{color:var(--ack);font-size:22px}
.mid .vs{font-family:var(--num);font-size:var(--fvs);font-weight:700;letter-spacing:.2em;color:var(--mute);padding:0 10px}
.tb.pub .mid .vs{color:var(--accent)}
.pill{justify-self:end;font-size:20px;font-weight:700;line-height:26px;height:28px;padding:0 12px;text-align:center;border-radius:6px;border:1px solid;white-space:nowrap}
.pill.ghost{color:var(--mute);border-color:var(--edge2);border-style:dashed}
.pill.draft{color:var(--wait);border-color:var(--wait);border-style:dashed;background:var(--wait-bg)}
.pill.pub{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.playing{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.pill.ack{color:var(--ack);border-color:var(--ack);background:var(--ack-bg)}
.byeinfo{position:absolute;left:9px;right:7px;border:1px dashed rgba(201,166,255,.6);border-radius:10px;
  background:linear-gradient(135deg,rgba(201,166,255,.12),rgba(201,166,255,.03));
  display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 16px;white-space:nowrap;transition:opacity .4s}
.byeinfo h4{font-size:var(--fno);font-weight:700;color:var(--ack);line-height:1.3;letter-spacing:.06em}
.byeinfo p{font-size:var(--fdk);line-height:1.45;color:var(--sub)}
.tb.ghost .byeinfo{opacity:0}

/* 参加者の札（表＝名前・成績・デッキ 4 個／裏＝伏せ札） */
.tile{position:absolute;left:0;top:0;z-index:2;perspective:var(--persp);cursor:pointer;
  transition:transform .34s cubic-bezier(.35,.1,.25,1)}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.3,.85,.35,1.2)}
.tile.down .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--card);border:1px solid var(--edge);padding:var(--pad);
  display:grid;grid-template-rows:var(--nmh) repeat(4,minmax(0,1fr));row-gap:var(--gap)}
.tile:hover .front{background:var(--card2);border-color:var(--edge2)}
.back{transform:rotateY(180deg);border:1px dashed #4b566e;display:flex;align-items:center;justify-content:center;gap:16px;
  background:repeating-linear-gradient(135deg,#12151d 0 12px,#171c28 12px 24px)}
.back b{font-family:var(--num);font-size:var(--fq);line-height:1;color:var(--accent);text-shadow:0 0 28px rgba(124,163,255,.55)}
.back i{font-style:normal;font-size:15px;font-weight:700;letter-spacing:.3em;color:var(--mute)}
.nr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.nr .nm{font-size:var(--fnm);font-weight:700;line-height:var(--nmh)}
.rec{flex:none;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--frec);font-weight:700;line-height:var(--nmh);color:var(--mute);white-space:nowrap}
.rec .w{color:var(--ok)} .rec .l{color:var(--danger)} .rec .o{color:var(--sub);font-weight:400}
.dk{display:flex;align-items:center;gap:8px;min-width:0;min-height:0;padding:0 8px 0 3px;border-radius:7px;border:1px solid var(--edge2);
  background:#141925;font-size:var(--fdk);line-height:1.3}
.dk .b{flex:none;width:var(--bw);height:calc(var(--fdk) + 3px);line-height:calc(var(--fdk) + 3px);text-align:center;border-radius:5px;
  font-size:var(--fdk);font-weight:700;white-space:nowrap}
.dk .t{flex:1}
.dk.open{border-color:#4a66ad;background:rgba(124,163,255,.08)}
.dk.open .b{background:var(--accent);color:#0b1020}
.dk.used{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.025);color:var(--mute)}
.dk.used .b{background:#242831;color:var(--sub)}
.dk.used .t{text-decoration:line-through;text-decoration-thickness:2px}
.dk.secret{border-style:dashed;border-color:#394256;color:var(--mute);background:repeating-linear-gradient(135deg,#12151d 0 8px,#161a24 8px 16px)}
.dk.secret .b{background:rgba(124,163,255,.14);color:var(--accent)}
.dk.secret .t{letter-spacing:.3em;opacity:.55}
.tile.pre .dk{opacity:0}
.tile.pop .dk{animation:dkin .34s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i) * .07s)}
@keyframes dkin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.noanim .tile,.noanim .flip,.noanim .tb{transition:none!important}

/* 抽選前の見出しと説明 */
#pre{position:absolute;left:4px;top:0;height:36px;display:flex;align-items:baseline;gap:14px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#pre h2{font-size:24px;font-weight:700;letter-spacing:.04em}
#pre h2 b{font-family:var(--num);font-size:30px;color:var(--accent);margin:0 6px}
#pre span{font-size:20px;color:var(--sub)}
#note{position:absolute;border:1px dashed var(--edge2);border-radius:10px;padding:0 18px;display:flex;flex-direction:column;justify-content:center;
  gap:2px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#note h4{font-size:var(--fdk);font-weight:700;color:var(--accent);letter-spacing:.08em;line-height:1.5}
#note li{list-style:none;font-size:var(--fdk);line-height:1.5;color:var(--sub)}
#note li::before{content:"・";color:var(--mute)}
[data-phase=before] #pre,[data-phase=before] #note{opacity:1}

/* 下の帯（凡例・棄権者・主催者の操作） */
.foot{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 14px;
  background:var(--surface);border:1px solid var(--edge);border-radius:12px;white-space:nowrap}
.f-l{display:flex;align-items:center;gap:18px;min-width:0}
.drop{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--mute)}
.drop .nm{font-weight:700;color:var(--sub);text-decoration:line-through;text-decoration-color:var(--mute)}
.tag{flex:none;font-size:15px;font-weight:700;padding:1px 8px;border-radius:5px;border:1px solid var(--edge2);color:var(--sub)}
.tag.out{border-color:#7a3a3d;color:var(--danger);background:var(--danger-bg)}
.sep{width:1px;height:26px;background:var(--edge)}
.legend{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{font-style:normal;font-size:14px;font-weight:700;padding:0 7px;border-radius:4px;line-height:20px}
.legend i.used{background:#242831;color:var(--sub)} .legend i.open{background:var(--accent);color:#0b1020} .legend i.secret{background:rgba(124,163,255,.14);color:var(--accent)}
.f-r{display:flex;align-items:center;gap:8px;flex:none}

/* ================= ラウンド中（H 案の簡易版） ================= */
.left{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;height:32px;white-space:nowrap}
.ph h2{font-size:20px;font-weight:700;letter-spacing:.03em;display:flex;align-items:baseline;gap:10px}
.ph h2 small{font-size:15px;font-weight:400;color:var(--sub)}
.timer{flex:none;height:150px;border-radius:12px;border:1px solid var(--edge);position:relative;
  background:linear-gradient(180deg,#191e2a,#11141a);padding:8px 14px;display:grid;grid-template-columns:minmax(0,1fr) 104px;column-gap:10px;align-items:center}
.timer::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.tm-main{display:flex;flex-direction:column;min-width:0}
.tm-lab{display:flex;align-items:center;gap:10px;height:24px;font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.1em}
.tm-state{font-size:13px;letter-spacing:.04em;padding:1px 8px;border-radius:5px;border:1px solid var(--ok);color:var(--ok);background:var(--ok-bg)}
.tm-state.stop{border-color:var(--wait);color:var(--wait);background:var(--wait-bg)}
#tm{display:block;width:100%;height:108px;border:1px dashed transparent;border-radius:10px;background:transparent;outline:0;
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:108px;font-weight:700;line-height:106px;letter-spacing:.04em;
  text-align:center;color:#fff;text-shadow:0 0 26px rgba(124,163,255,.45)}
#tm:not([readonly]):hover{border-color:var(--edge2)}
#tm:not([readonly]):focus{border-color:var(--accent);background:#0c0e13}
#tm.warn{color:var(--wait)} #tm.up{color:var(--danger)}
.tm-ctl{display:flex;flex-direction:column;gap:6px}
.tm-hint{font-size:12px;color:var(--mute);line-height:1.35}
.strip{flex:none;height:40px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;white-space:nowrap}
.strip .hint{flex:1;text-align:right}
.cnts{display:flex;gap:14px;font-size:20px;font-weight:700}
.cnt b{font-family:var(--num);font-size:22px;margin-left:5px}
.c-playing{color:var(--accent)} .c-ack{color:var(--ack)}
.bar{flex:none;display:flex;gap:4px;height:6px;margin:6px 0 8px}
.bar i{flex:1;border-radius:3px;background:var(--edge)}
.bar i.playing{background:var(--accent)} .bar i.ack{background:var(--ack)}
.tgrid{flex:1;min-height:0;display:grid;gap:6px}
.tc{min-height:0;min-width:0;display:grid;grid-template-columns:98px minmax(0,1fr);column-gap:10px;align-items:center;
  padding:0 10px;background:var(--card);border:1px solid var(--edge);border-left:4px solid var(--edge2);border-radius:9px;cursor:pointer}
.tc:hover{background:var(--card2)}
.tc.playing{border-left-color:var(--accent)}
.tc.ack{border-left-color:var(--ack);background:linear-gradient(90deg,rgba(201,166,255,.09),var(--card) 60%)}
.sd{display:flex;flex-direction:column;gap:4px;min-width:0}
.tc .no{font-size:20px;font-weight:700;color:var(--sub);line-height:26px;white-space:nowrap}
.tc .no b{font-family:var(--num);font-size:24px;color:var(--ink);margin-left:4px}
.tc .pill{justify-self:stretch;padding:0}
.bd{display:grid;min-width:0;align-items:center}
.pn{display:flex;align-items:center;gap:5px;min-width:0;font-weight:700}
.pn .dot{flex:none;width:8px;height:8px;border-radius:50%;border:1px solid var(--edge2)}
.it{font-size:20px;line-height:26px;white-space:nowrap;color:var(--sub);min-width:0}
.it.ack{color:var(--ack)} .it.mute{color:var(--mute)}
.tnote{grid-column:1/-1;font-size:17px;line-height:26px;color:var(--ack);white-space:nowrap}
.tgrid.cmp .bd{grid-template-columns:260px minmax(0,1fr);gap:3px 8px}
.tgrid.cmp .pn .nm{font-size:20px;line-height:26px}
.tgrid.big .bd{grid-template-columns:minmax(0,1fr);row-gap:4px}
.tgrid.big .pn .nm{font-size:24px;line-height:32px}
.tgrid.big .pn:nth-child(3){margin-top:8px}
.tgrid.big .tc .no b{font-size:30px}
.tgrid.big .sd{gap:8px}
/* 順位表（I 案の形の簡易版: 1 人 1 行） */
.rh,.rr{display:grid;grid-template-columns:44px 262px 92px repeat(4,minmax(0,1fr));column-gap:12px;align-items:center;padding:0 8px}
.rh{flex:none;height:26px;margin-top:4px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.06em;white-space:nowrap}
.rt{flex:1;min-height:0;display:grid;align-content:start}
.rr{min-height:0;font-size:20px;line-height:28px;border-top:1px solid rgba(255,255,255,.06);cursor:pointer;white-space:nowrap}
.rr:hover{background:var(--card)}
.rr .rk{font-family:var(--num);font-size:22px;font-weight:700;color:var(--sub);text-align:center}
.rr .nmw{display:flex;align-items:center;gap:8px;min-width:0}
.rr .nm{font-weight:700}
.rr .rec{font-size:22px;line-height:28px}
.dc{padding-left:9px;border-left:3px solid var(--edge2)}
.dc.open{border-left-color:var(--accent)}
.dc.used{color:var(--mute);text-decoration:line-through;text-decoration-thickness:2px}
.dc.secret{color:var(--mute);border-left-style:dashed}
.rr.dropped{opacity:.55}

/* ---------- 全文表示（クリックで開く） ---------- */
#pop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,9,.62);z-index:40}
#pop.on{display:flex}
.popbox{width:980px;max-height:900px;background:#161a23;border:1px solid var(--accent);border-radius:14px;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.popbox h3{font-size:30px;font-weight:700;line-height:1.35;margin-bottom:6px;word-break:break-all}
.popbox .ps{font-size:20px;color:var(--sub);margin-bottom:12px}
.popbox ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.popbox li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:baseline;font-size:24px;line-height:1.4;padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--edge)}
.popbox li .k{font-size:18px;color:var(--sub)}
.popbox .cl{margin-top:16px;text-align:right}
#toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);padding:9px 22px;border-radius:30px;background:#11141c;border:1px solid var(--accent);
  font-size:17px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:50}
#toast.on{opacity:1}

/* 動きを減らす設定のときは演出を省く（JS 側でも抽選結果をすぐ出す） */
@media (prefers-reduced-motion:reduce){
  .tile,.flip,.tb,#pre,#note,.byeinfo{transition:none!important}
  .tile.pop .dk,.tb.hit,body.inround #round{animation:none!important}
}
body.still .tile,body.still .flip,body.still .tb,body.still #pre,body.still #note,body.still .byeinfo{transition:none!important}
body.still .tile.pop .dk,body.still .tb.hit,body.still.inround #round{animation:none!important}
</style>

<body>
<div id="stage">
  <header class="top">
    <div class="top-l">
      <div class="brand"><i></i>しまWS</div>
      <div class="tname">第3回 しま交流CS</div>
      <span class="chip rule">しま2026版ピラミッド</span>
      <span class="chip">スイス式・登録 4 デッキ</span>
      <span class="chip" id="chipN"></span>
      <span class="chip round" id="chipR"></span>
    </div>
    <div class="top-r">
      <div class="seg org" id="segS"><span>モック状態</span></div>
      <div class="seg org" id="segN"><span>人数</span></div>
      <a class="lnk org" href="#progress-fix" id="bFix" title="組み合わせの手直し・報告修正などの例外対応">大会進行修正 ↗</a>
      <button class="lnk" id="bHide" title="主催者ボタンを隠す／出す（H キー）">操作を隠す</button>
    </div>
  </header>

  <!-- マッチング画面: 順位表は出さず、抽選盤だけを大きく映す -->
  <div id="match">
    <section class="hero box">
      <div class="h-ttl"><span class="r" id="hR"></span><span class="t">組み合わせ抽選</span></div>
      <div class="h-mid">
        <div class="steps" id="steps"></div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="h-tm"><span class="k">制限時間<span class="s">停止中</span></span><span class="v num" id="htm">35:00</span></div>
    </section>
    <section id="board" class="box" data-phase="before">
      <div id="frames"></div>
      <div id="pre"></div>
      <div id="note" class="box"></div>
    </section>
    <footer class="foot box">
      <div class="f-l" id="footL"></div>
      <div class="f-r org" id="footR"></div>
    </footer>
  </div>

  <!-- ラウンド中: H 案の雰囲気の簡易版 -->
  <main id="round">
    <section class="left" id="rLeft"></section>
    <section class="panel box" id="rRight"></section>
  </main>

  <div id="pop"><div class="popbox" id="popbox"></div></div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* ===== サンプルデータ（タイトル名は titles.js の実在名。表示名は架空） ===== */
const NAMES=["アリス","しまうま大好きクラブ","ボブ","深夜のカレーうどん部","チャーリー","ねこ","みかんの皮むき名人","ヨル",
  "ダイヤ","赤いきつねと緑の人","エレン","ゆき","帰ってきたサブロウ","フラン","ヴァイス初心者です。","山田"];
const POOL=["アイドルマスター シャイニーカラーズ","痛いのは嫌なので防御力に極振りしたいと思います。","ウマ娘 プリティーダービー",
  "オーバーロード","【推しの子】","かぐや様は告らせたい～天才たちの恋愛頭脳戦～","学園アイドルマスター",
  "ガールズバンドクライ","五等分の花嫁","勝利の女神：NIKKE","進撃の巨人","SPY×FAMILY",
  "葬送のフリーレン","ソードアート・オンライン","ダンジョンに出会いを求めるのは間違っているだろうか","チェンソーマン",
  "転生したらスライムだった件","東方Project","ブルーアーカイブ","プロジェクトセカイ カラフルステージ！ feat. 初音ミク",
  "ヘブンバーンズレッド","ぼっち・ざ・ろっく！","ホロライブプロダクション","ラブライブ！蓮ノ空女学院スクールアイドルクラブ"];
const COST=[3.5,2,3,2.5,3,2.5,3.5,1.5,2,2,2,2,2,3,1.5,2.5,2.5,2,1,2.5,1.5,2.5,4,3.5];
const OFF=[0,7,13,20], ROUNDS=4, DONE=2;           /* 2 ラウンド終了 → ROUND 3 の抽選 */
const STATES=["before","drawing","drafted","published","round"];
const SLAB={before:"抽選前",drawing:"演出",drafted:"下書き",published:"公開",round:"R中"};

const qs=new URLSearchParams(location.search);
let N=qs.get("players")==="16"?16:8;
let ST=STATES.includes(qs.get("state"))?qs.get("state"):"before";
const SEED=parseInt(qs.get("seed")||"0",10)||0;
const STOP=parseInt(qs.get("stop")||"0",10)||0;    /* 撮影用: この卓数がめくれたところで演出を止める */
const REDUCED=qs.get("motion")==="0"||(qs.get("motion")!=="1"&&matchMedia("(prefers-reduced-motion: reduce)").matches);
if(REDUCED)document.body.classList.add("still");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ===== 大会の進行（モック内の簡易シミュレーション。H 案と同じ考え方） ===== */
let T=null,C=null,phase="before",drawNo=0;
function newT(n){
  const players=NAMES.slice(0,n).map((name,i)=>({id:i,name,dropAfter:i===n-1?1:0,
    decks:OFF.map(o=>{const k=(i*5+o)%POOL.length;return{title:POOL[k],base:COST[k]}})}));
  return{n,players,rounds:[]};
}
const isDropped=(p,ri)=>p.dropAfter>0&&ri>=p.dropAfter;
function calc(){
  const s=T.players.map(p=>({p,w:0,l:0,d:0,m:0,bye:0,opp:[],deck:p.decks.map(()=>({st:"secret",r:0})),
    cost:p.decks.reduce((a,d)=>a+d.base,0),dropped:isDropped(p,DONE)}));
  T.rounds.forEach((R,ri)=>{
    R.matches.forEach(m=>{ if(m.status!=="done")return;
      const A=s[m.a],B=s[m.b];A.m++;B.m++;A.opp.push(m.b);B.opp.push(m.a);
      if(m.res==="a"){A.w++;B.l++}else if(m.res==="b"){B.w++;A.l++}else{A.d++;B.d++}
      /* ピラミッド: 勝ったデッキは使用済み、負けたデッキは公開済みで使用可 */
      A.deck[ri]={st:m.res==="a"?"used":"open",r:ri+1};B.deck[ri]={st:m.res==="b"?"used":"open",r:ri+1};});
    if(R.bye&&R.bye.status==="done"){const A=s[R.bye.p];A.w++;A.m++;A.bye++;A.deck[ri]={st:"used",r:ri+1}}
  });
  s.forEach(x=>x.rate=x.m?x.w/x.m:0);
  s.forEach(x=>x.omw=x.opp.length?x.opp.reduce((a,o)=>a+s[o].rate,0)/x.opp.length:0);
  /* 並び: 棄権者は最下段 → 勝ち数 → 勝率 → 登録デッキの合計コストが低い → OMW% */
  const order=[...s].sort((x,y)=>(x.dropped-y.dropped)||(y.w-x.w)||(y.rate-x.rate)||(x.cost-y.cost)||(y.omw-x.omw)||(x.p.id-y.p.id));
  return{s,order};
}
/* 勝ち数の近い人どうし・再戦なし。奇数なら不戦勝の少ない人から 1 名を不戦勝にする */
function pairRound(seed,status){
  const ri=T.rounds.length,rnd=rng(seed),st=calc();
  let act=st.order.filter(x=>!isDropped(x.p,ri)).map(x=>({id:x.p.id,w:x.w,bye:x.bye,k:rnd()}));
  act.sort((x,y)=>(y.w-x.w)||(x.k-y.k));
  let bye=null;
  if(act.length%2){for(let i=act.length-1;i>=0;i--){if(!act[i].bye){bye=act[i].id;act.splice(i,1);break}} if(bye===null)bye=act.pop().id}
  const played=(a,b)=>T.rounds.some(R=>R.matches.some(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a)));
  const solve=l=>{if(!l.length)return[];const a=l[0];for(let k=1;k<l.length;k++){if(played(a,l[k]))continue;
    const rest=solve(l.filter((_,i)=>i!==0&&i!==k));if(rest)return[[a,l[k]],...rest]}return null};
  const ids=act.map(x=>x.id);
  const pairs=solve(ids)||ids.reduce((r,x,i)=>(i%2?r[r.length-1].push(x):r.push([x]),r),[]);
  const matches=pairs.map(([a,b])=>{const x=rnd();let res=x<0.06?"d":x<0.53?"a":"b";
    if(T.players[a].dropAfter===ri+1)res="b"; if(T.players[b].dropAfter===ri+1)res="a";
    return{a,b,res,status}});
  T.rounds.push({matches,bye:bye===null?null:{p:bye,status}});
}
function preset(n){
  T=newT(n);
  for(let r=1;r<=DONE;r++)pairRound(n*1000+r*17+3,"done");
  C=calc();
}
const cur=()=>T.rounds[DONE]||null;
const activeIds=()=>T.players.filter(p=>!isDropped(p,DONE)).map(p=>p.id);
const droppedPs=()=>T.players.filter(p=>isDropped(p,DONE));
function newDraft(){
  if(T.rounds.length>DONE)T.rounds.pop();
  drawNo++;
  const seed=SEED?SEED+drawNo*101:(Date.now()+drawNo*7919)%1000003;
  pairRound(seed,"draft");return seed;
}
/* 卓の一覧（卓 1..k、最後に不戦勝） */
function cardList(){const R=cur();if(!R)return[];
  return R.matches.map((m,i)=>({bye:false,i,ids:[m.a,m.b]})).concat(R.bye?[{bye:true,ids:[R.bye.p]}]:[])}

/* ===== 抽選盤の寸法（ステージは 1920x1080 固定なので px で決められる） ===== */
const board=$("#board");
let G=null,tiles={},frameEls=[];
function geom(){
  const W=board.clientWidth,H=board.clientHeight,n=activeIds().length,cards=Math.ceil(n/2),cols=4,rows=Math.ceil(cards/cols),gap=12;
  const cw=(W-gap*(cols-1))/cols,ch=(H-gap*(rows-1))/rows,MB=rows>1?41:56;
  const th=Math.floor((ch-MB-28)/2),tw=cw-18,PH=44,rowsN=rows*2;
  const cardPos=c=>({x:(c%cols)*(cw+gap),y:Math.floor(c/cols)*(ch+gap)});
  return{W,H,n,cards,cols,rows,cw,ch,MB,th,tw,cardPos,
    slot:(c,s)=>{const p=cardPos(c);return{x:p.x+10,y:p.y+8+(s?th+MB+12:0)}},
    pre:i=>({x:(i%cols)*(cw+gap)+10,y:PH+Math.floor(i/cols)*((H-PH-th)/(rowsN-1))})};
}
const setPos=(el,p)=>{el.style.transform=`translate(${p.x}px,${p.y}px)`};
function dkHtml(d,ds,j){
  const L={used:"使用済",open:"使用可",secret:"未公開"}[ds.st];
  return`<span class="dk ${ds.st}" style="--i:${j}"><span class="b">${L}</span><span class="t ell">${ds.st==="secret"?"？？？":esc(d.title)}</span></span>`;
}
const recHtml=x=>`<span class="rec num" title="勝-負-分"><b class="w">${x.w}</b>-<b class="l">${x.l}</b>-<b class="o">${x.d}</b></span>`;
function buildTiles(){
  board.querySelectorAll(".tile").forEach(e=>e.remove());tiles={};
  G=geom();board.classList.toggle("big",G.rows===1);
  activeIds().forEach(id=>{
    const x=C.s[id],el=document.createElement("div");
    el.className="tile";el.dataset.pop="p:"+id;el.style.width=G.tw+"px";el.style.height=G.th+"px";
    el.innerHTML=`<div class="flip"><div class="face front box"><div class="nr"><span class="nm ell">${esc(x.p.name)}</span>${recHtml(x)}</div>`+
      x.p.decks.map((d,j)=>dkHtml(d,x.deck[j],j)).join("")+`</div><div class="face back box"><b>?</b><i>しまWS</i></div></div>`;
    board.appendChild(el);tiles[id]=el;
  });
  /* 抽選前の見出しと、空いた 1 マスに入れる説明 */
  const dp=droppedPs().length;
  $("#pre").innerHTML=`<h2>抽選対象<b>${G.n}</b>名</h2><span>登録 ${T.n} 名${dp?`のうち途中棄権 ${dp} 名を除く`:""}　｜　札は 名前・ここまでの成績（勝-負-分）・登録デッキ 4 個の状態</span>`;
  const note=$("#note"),free=G.n<G.cols*G.rows*2;
  note.style.display=free?"":"none";
  if(free){const p=G.pre(G.n);note.style.left=p.x+"px";note.style.top=p.y+"px";note.style.width=G.tw+"px";note.style.height=G.th+"px";
    note.innerHTML=`<h4>抽選のしかた</h4><ul><li>勝ち数の近い人どうしで組みます</li><li>同じ相手との再戦は避けます</li>`+
      (G.n%2?`<li>奇数のため 1 名が不戦勝になります</li>`:"")+(dp?`<li>途中棄権の ${dp} 名は対象外です</li>`:"")+`</ul>`}
}
const PILL={ghost:"抽選中",draft:"下書き",pub:"公開済み"};
function buildFrames(cls){
  const cards=cardList();
  $("#frames").innerHTML=cards.map((c,ci)=>{const p=G.cardPos(ci),midTop=7+G.th+6;
    return`<div class="tb box ${cls}${c.bye?" bye":""}" style="left:${p.x}px;top:${p.y}px;width:${G.cw}px;height:${G.ch}px">
      <div class="mid" style="top:${midTop}px;height:${G.MB}px">${c.bye?`<span class="no">不戦勝</span><span class="vs">BYE</span>`:`<span class="no">卓<b>${c.i+1}</b></span><span class="vs">VS</span>`}<span class="pill ${cls}">${PILL[cls]}</span></div>
      ${c.bye?`<div class="byeinfo box" style="top:${midTop+G.MB+6}px;height:${G.th}px"><h4>不戦勝</h4><p>対戦相手なし・1 勝として数えます</p><p>公開後、本人の「了解」で確定します</p><p>使用済みにするデッキは本人が選びます</p></div>`:""}
    </div>`}).join("");
  frameEls=[...document.querySelectorAll("#frames .tb")];
  return cards;
}
function setFrame(el,cls){el.classList.remove("ghost","draft","pub","hot");el.classList.add(cls);
  const p=el.querySelector(".pill");p.className="pill "+cls;p.textContent=PILL[cls]}

/* ===== 演出 ===== */
let timers=[];
const later=(ms,fn)=>timers.push(setTimeout(fn,ms));
function cancelAnim(){timers.forEach(clearTimeout);timers=[]}
let revealed=0;
/* 演出なしで、いまの段階の絵をそのまま出す */
function show(){
  cancelAnim();board.classList.add("noanim");board.dataset.phase=phase==="round"?"published":phase;
  const act=activeIds();
  act.forEach(id=>{const t=tiles[id];t.classList.remove("down","pop","pre");t.style.zIndex="";t.querySelector(".flip").style.transitionDelay=""});
  if(phase==="before"){$("#frames").innerHTML="";frameEls=[];act.forEach((id,i)=>setPos(tiles[id],G.pre(i)))}
  else{const cards=buildFrames(phase==="drafted"?"draft":"pub");
    cards.forEach((c,ci)=>c.ids.forEach((id,s)=>setPos(tiles[id],G.slot(ci,s))));revealed=cards.length}
  void board.offsetWidth;board.classList.remove("noanim");
  ui();
}
/* 抽選: 札を伏せる → 混ぜる → 卓に配る → 下の卓から 1 卓ずつめくる（卓 1 が最後） */
function draw(){
  cancelAnim();
  const seed=newDraft();
  if(REDUCED){phase="drafted";show();toast("組み合わせを抽選しました（未公開の下書き）");return}
  phase="drawing";revealed=0;board.dataset.phase="drawing";
  const cards=buildFrames("ghost"),act=activeIds(),rnd=rng(seed^0x9e3779b9);
  window.__t0=performance.now();
  act.forEach((id,i)=>{const t=tiles[id];t.classList.remove("pop","pre");t.querySelector(".flip").style.transitionDelay=(i*16)+"ms";t.classList.add("down")});
  ui();
  const slots=[];cards.forEach((c,ci)=>{slots.push(G.slot(ci,0));if(!c.bye)slots.push(G.slot(ci,1))});
  const SHUF=5,STEP=330,REV=G.rows>1?850:1250;
  let t=640;
  for(let k=0;k<SHUF;k++)later(t+k*STEP,()=>{
    const perm=slots.slice();for(let i=perm.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
    act.forEach((id,i)=>{tiles[id].style.zIndex=2+Math.floor(rnd()*9);tiles[id].querySelector(".flip").style.transitionDelay="";setPos(tiles[id],perm[i])})});
  t+=SHUF*STEP;
  later(t,()=>cards.forEach((c,ci)=>c.ids.forEach((id,s)=>setPos(tiles[id],G.slot(ci,s)))));
  t+=520;
  const order=cards.map((_,i)=>i).reverse();      /* 不戦勝 → 下位卓 → … → 卓 1 */
  order.forEach(ci=>{
    if(ci===0&&order.length>1)t+=450;             /* 卓 1 の前にひと呼吸 */
    const at=t;
    later(at,()=>{frameEls[ci].classList.remove("ghost");frameEls[ci].classList.add("hot");flipUp(cards[ci].ids[0])});
    if(!cards[ci].bye)later(at+240,()=>flipUp(cards[ci].ids[1]));
    later(at+620,()=>{setFrame(frameEls[ci],"draft");frameEls[ci].classList.add("hit");revealed++;ui();if(STOP&&revealed===STOP)cancelAnim()});
    t+=REV;
  });
  later(t+150,()=>{phase="drafted";board.dataset.phase="drafted";ui()});
}
/* 札をめくる。表が見えはじめる頃（半回転）にデッキ 4 個を順に出す */
function flipUp(id){const t=tiles[id];t.style.zIndex="";t.classList.add("pre");t.classList.remove("down");
  later(230,()=>{t.classList.remove("pre");t.classList.add("pop")})}

/* ===== 画面の文言・主催者ボタン ===== */
function ui(){
  const dp=droppedPs(),cards=cardList().length||Math.ceil(activeIds().length/2);
  $("#chipN").textContent=`参加 ${T.n} 名`+(dp.length?`（棄権 ${dp.length}）`:"");
  $("#chipR").textContent=phase==="round"?`ROUND ${DONE+1} / ${ROUNDS}`:`ROUND ${DONE+1} マッチング`;
  $("#hR").innerHTML=`ROUND ${DONE+1}<small> / ${ROUNDS}</small>`;
  const stepNo={before:0,drawing:0,drafted:1,published:3,round:4}[phase];
  $("#steps").innerHTML=["抽選","下書きの確認","決定・公開","ラウンド START"].map((s,i)=>
    `${i?'<span class="ar">▶</span>':""}<span class="st${i<stepNo?" done":i===stepNo?" on":""}"><b>${i<stepNo?"✓":i+1}</b>${s}</span>`).join("");
  const m=$("#msg");
  m.className="msg "+({drawing:"draw",drafted:"draft",published:"pub"}[phase]||"");
  m.innerHTML=phase==="before"?`<b>抽選前</b>　｜　${cards} 卓ぶんの組み合わせを、これから抽選します`:
    phase==="drawing"?`<b>抽選中…</b>　決定 <b class="num">${revealed} / ${cards}</b>`:
    phase==="drafted"?`<b>下書き（参加者の端末には未公開）</b>　｜　主催者が確認して公開します`:
    `<b>組み合わせ決定！</b>　自分の卓へ移動してください　｜　START でラウンド開始`;
  $("#footL").innerHTML=(dp.length?`<span class="drop"><span class="tag out">途中棄権・抽選の対象外</span>${dp.map(p=>`<span class="nm">${esc(p.name)}</span>`).join("")}</span><i class="sep"></i>`:"")+
    `<span class="legend"><span><i class="used">使用済</i>勝って使用済み</span><span><i class="open">使用可</i>公開済み・まだ使える</span><span><i class="secret">未公開</i>伏せています</span><span>成績＝勝-負-分</span></span>`;
  if(armed)disarm();
  $("#footR").innerHTML=`<span class="who">主催者</span>`+(
    phase==="before"?`<span class="hint">結果は下書きになります（やり直せます）</span><button class="btn pri" data-act="draw">抽選する</button>`:
    phase==="drawing"?`<span class="hint">抽選中…</span><button class="btn" data-act="skip">演出を飛ばす</button>`:
    phase==="drafted"?`<span class="hint">公開するまで参加者には見えません</span><button class="btn" data-act="draw">再抽選</button><button class="btn pri" data-act="publish" data-arm="1">決定して公開</button>`:
    `<span class="hint">手直しは「大会進行修正」で</span><button class="btn pri" data-act="start">ラウンド START</button>`);
  document.body.classList.toggle("inround",phase==="round");
  document.querySelectorAll("#segS button").forEach(b=>b.classList.toggle("on",b.dataset.v===phase));
  document.querySelectorAll("#segN button").forEach(b=>b.classList.toggle("on",+b.dataset.v===N));
  marks();
}
function marks(){document.querySelectorAll(".ell").forEach(e=>{e.title=e.textContent;e.classList.toggle("cut",e.scrollWidth>e.clientWidth)})}

/* ===== ラウンド中（H 案の簡易版） ===== */
const tm={base:2100,left:2100,run:false,end:0};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tmSet(base,left,run){tm.base=base;tm.left=left;tm.run=run;tm.end=Date.now()+left*1000}
function tmDraw(){
  const el=$("#tm");if(!el)return;
  if(tm.run){tm.left=Math.max(0,Math.ceil((tm.end-Date.now())/1000));if(tm.left===0)tm.run=false}
  if(document.activeElement!==el||tm.run)el.value=fmt(tm.left);
  el.readOnly=tm.run;el.className=tm.left===0?"up":tm.left<=300?"warn":"";
  const s=$("#tmState");s.textContent=tm.run?"進行中":tm.left===0?"時間切れ":"停止中";s.className="tm-state"+(tm.run?"":" stop");
  $("#tmGo").textContent=tm.run?"STOP":"START";$("#tmReset").disabled=tm.run;
}
function tmToggle(){
  if(tm.run){tm.run=false;tmDraw();return}
  const m=/^\s*(\d{1,3})\s*[:：]\s*(\d{1,2})\s*$/.exec($("#tm").value);
  if(!m){toast("時間は 分:秒 で入力してください");$("#tm").value=fmt(tm.left);return}
  const v=Math.min(999*60,(+m[1])*60+(+m[2]));if(v<=0){toast("1 秒以上を入力してください");return}
  if(v!==tm.left||tm.left===tm.base)tm.base=v;tmSet(tm.base,v,true);tmDraw();
}
setInterval(tmDraw,250);
function renderRound(){
  const R=cur(),P=T.players,cmp=T.n>8,k=R.matches.length+(R.bye?1:0);
  const row=p=>`<span class="pn"><i class="dot"></i><span class="nm ell">${esc(p.name)}</span></span><span class="it mute">未報告</span>`;
  $("#rLeft").innerHTML=`<div class="timer box"><div class="tm-main"><div class="tm-lab">ROUND ${DONE+1} / ${ROUNDS}　残り時間<span class="tm-state" id="tmState"></span></div>
      <input id="tm" class="num" inputmode="numeric" maxlength="6" aria-label="残り時間（分:秒）。停止中は直接編集できます" spellcheck="false"></div>
    <div class="tm-ctl org"><button class="btn pri" id="tmGo">STOP</button><button class="btn" id="tmReset">RESET</button><span class="tm-hint">停止中は数字を<br>直接編集できます</span></div></div>
  <div class="panel box" style="flex:1"><div class="ph"><h2>対戦卓<small>ROUND ${DONE+1}</small></h2><div class="cnts"><span class="cnt c-playing">対戦中<b>${R.matches.length}</b></span>${R.bye?`<span class="cnt c-ack">了解待ち<b>1</b></span>`:""}</div></div>
    <div class="bar">${R.matches.map(()=>`<i class="playing"></i>`).join("")}${R.bye?`<i class="ack"></i>`:""}</div>
    <div class="tgrid ${cmp?"cmp":"big"}" style="grid-template-rows:repeat(${k},minmax(0,1fr))">
      ${R.matches.map((m,i)=>`<div class="tc box playing" data-pop="t:${i}"><div class="sd"><span class="no">卓<b>${i+1}</b></span><span class="pill playing">対戦中</span></div><div class="bd">${row(P[m.a])}${row(P[m.b])}</div></div>`).join("")}
      ${R.bye?`<div class="tc box ack" data-pop="p:${R.bye.p}"><div class="sd"><span class="no">不戦勝</span><span class="pill ack">了解待ち</span></div><div class="bd"><span class="pn"><i class="dot"></i><span class="nm ell">${esc(P[R.bye.p].name)}</span></span><span class="it ack">不戦勝</span><span class="tnote ell">本人の了解で確定（使用済みにするデッキを選択）</span></div></div>`:""}</div>
    <div class="strip org"><span class="who">主催者</span><button class="btn" disabled>ラウンド終了</button><span class="hint">全卓の確定後に押せます（残り ${k} 卓）</span></div></div>`;
  let rank=0;
  $("#rRight").innerHTML=`<div class="ph"><h2>順位表<small>ROUND ${DONE} 終了時点　｜　並び: 勝ち数 → 勝率 → 合計コスト(低) → OMW%　｜　簡易表示（本番は I 案の形）</small></h2></div>
    <div class="rh"><span>順位</span><span>参加者</span><span>勝-負-分</span><span>登録デッキ 1</span><span>2</span><span>3</span><span>4</span></div>
    <div class="rt" style="grid-template-rows:repeat(${C.order.length},minmax(0,66px))">${C.order.map(x=>{const r=x.dropped?0:++rank;
      return`<div class="rr${x.dropped?" dropped":""}" data-pop="p:${x.p.id}"><span class="rk">${r||"–"}</span><span class="nmw"><span class="nm ell">${esc(x.p.name)}</span>${x.dropped?`<span class="tag">棄権</span>`:""}</span>${recHtml(x)}`+
        x.p.decks.map((d,j)=>`<span class="dc ${x.deck[j].st} ell">${x.deck[j].st==="secret"?"未公開":esc(d.title)}</span>`).join("")+`</div>`}).join("")}</div>`;
  tmDraw();
}

/* ===== 全文表示 ===== */
const SL={used:"勝って使用済み",open:"公開済み・使用可",secret:"未公開"};
function popHtml(key){
  const[k,a]=key.split(":"),P=T.players;
  const one=x=>`<h3>${esc(x.p.name)}</h3><div class="ps">ここまで ${x.w}勝 ${x.l}敗 ${x.d}分${x.bye?`（うち不戦勝 ${x.bye}）`:""}${x.dropped?"　／　途中棄権（抽選の対象外）":""}</div>
    <ul>${x.p.decks.map((d,j)=>{const ds=x.deck[j];return`<li><span class="k">${SL[ds.st]}${ds.r?"・R"+ds.r:""}</span><span>${ds.st==="secret"?"（確定した対戦で使うまで伏せています）":esc(d.title)}</span></li>`}).join("")}</ul>`;
  if(k==="p")return one(C.s[+a]);
  const m=cur().matches[+a];
  return`<h3>ROUND ${DONE+1}　卓 ${+a+1}</h3><div class="ps">対戦中（使用デッキは結果が確定するまで表示しません）</div>
    <ul>${[m.a,m.b].map(id=>{const x=C.s[id];return`<li><span class="k">ここまで ${x.w}-${x.l}-${x.d}</span><span>${esc(P[id].name)}</span></li>`}).join("")}</ul>`;
}
function openPop(key){$("#popbox").innerHTML=popHtml(key)+`<div class="cl"><button class="btn" data-act="close">閉じる（Esc）</button></div>`;$("#pop").classList.add("on")}
function closePop(){$("#pop").classList.remove("on")}
let toastT=0;
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2600)}

/* ===== 操作 ===== */
function act(a){
  if(a==="close")return closePop();
  if(a==="draw")return draw();
  if(a==="skip"){phase="drafted";show();return}
  if(a==="publish"){setStatus("playing");phase="published";show();
    if(!REDUCED)frameEls.forEach((f,i)=>{f.style.animationDelay=(i*45)+"ms";f.classList.add("hit")});
    toast(`ROUND ${DONE+1} の組み合わせを公開しました`);return}
  if(a==="start"){phase="round";tmSet(2100,2100,true);renderRound();ui();return}
}
function setStatus(s){const R=cur();R.matches.forEach(m=>m.status=s);if(R.bye)R.bye.status=s==="playing"?"ack":s}
let armed=null;
function disarm(){if(!armed)return;clearTimeout(armed._t);armed.textContent=armed.dataset.label;armed.classList.remove("armed");armed=null}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(b){if(b.disabled)return;
    if(b.dataset.arm&&armed!==b){if(armed)disarm();armed=b;b.dataset.label=b.textContent;b.textContent="もう一度押して確定";b.classList.add("armed");b._t=setTimeout(disarm,3500);return}
    if(armed){clearTimeout(armed._t);armed=null}
    return act(b.dataset.act)}
  if(e.target.id==="tmGo")return tmToggle();
  if(e.target.id==="tmReset"){if(!tm.run){tmSet(tm.base,tm.base,false);tmDraw()}return}
  if(e.target.id==="pop")return closePop();
  if(phase==="drawing")return;
  const p=e.target.closest("[data-pop]");if(p)openPop(p.dataset.pop);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePop();
  if(e.target.id==="tm"){if(e.key==="Enter"){e.target.blur();tmToggle()}return}
  if(e.key==="h"||e.key==="H")toggleOrg();
});
function toggleOrg(){const on=document.body.classList.toggle("hideorg");$("#bHide").textContent=on?"操作を表示":"操作を隠す"}
$("#bHide").onclick=toggleOrg;
$("#bFix").onclick=e=>{e.preventDefault();toast("「大会進行修正」タブを開きます（モックでは移動しません）")};

function load(){
  cancelAnim();closePop();drawNo=0;preset(N);buildTiles();
  phase=ST==="drawing"?"before":ST;
  if(phase!=="before"){newDraft();if(phase!=="drafted")setStatus("playing")}
  tmSet(2100,2100,phase==="round");
  if(phase==="round")renderRound();
  show();
  if(ST==="drawing")later(REDUCED?0:500,draw);
}
function go(){const u=new URL(location.href);u.searchParams.set("state",ST);u.searchParams.set("players",N);history.replaceState(null,"",u);load()}
STATES.forEach(v=>{const b=document.createElement("button");b.textContent=SLAB[v];b.dataset.v=v;b.onclick=()=>{ST=v;go()};$("#segS").appendChild(b)});
[8,16].forEach(v=>{const b=document.createElement("button");b.textContent=v+"人";b.dataset.v=v;b.onclick=()=>{N=v;go()};$("#segN").appendChild(b)});

/* ===== 画面に合わせた縮小 ===== */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("#stage");
  st.style.transform=`translate(${Math.max(0,(innerWidth-1920*s)/2)}px,${Math.max(0,(innerHeight-1080*s)/2)}px) scale(${s})`}
addEventListener("resize",fit);fit();
if(qs.get("hide")==="1")toggleOrg();
load();

/* ===== 見切れの自己検査（check.mjs から呼ぶ）。loose=演出の途中（札が動いている間）は枠内判定を省く ===== */
window.__phase=()=>phase;window.__revealed=()=>revealed;
window.__check=function(loose){
  const out={bad:[],ell:[],small:[],n:0},stage=$("#stage"),SR=stage.getBoundingClientRect(),sc=SR.width/1920;
  const name=e=>e.tagName.toLowerCase()+(e.id?"#"+e.id:"")+(e.className&&typeof e.className==="string"?"."+e.className.trim().split(/\s+/).join("."):"");
  const txt=e=>(e.value||e.textContent||"").trim().replace(/\s+/g," ").slice(0,30);
  if(document.documentElement.scrollWidth>innerWidth||document.documentElement.scrollHeight>innerHeight)out.bad.push("document scrolls");
  if(Math.abs(SR.width-1920*sc)>1||SR.right>innerWidth+0.5||SR.bottom>innerHeight+0.5)out.bad.push("stage outside viewport");
  stage.querySelectorAll("*").forEach(e=>{
    const cs=getComputedStyle(e);if(cs.display==="none"||cs.display==="inline"||cs.display==="contents")return;
    if(e.closest("#pop:not(.on)")||e.id==="toast")return;
    if(!e.offsetParent&&cs.position!=="fixed"&&e!==stage)return;             /* 非表示の画面（#match / #round の片方） */
    out.n++;
    const ow=e.scrollWidth-e.clientWidth,oh=e.scrollHeight-e.clientHeight,inTile=!!e.closest(".tile");
    if(loose&&inTile&&!e.classList.contains("ell"))return;
    if(ow>1){ if(e.classList.contains("ell")){ if(e.title===e.textContent&&e.closest("[data-pop]"))out.ell.push(txt(e));else out.bad.push("ellipsis without full text: "+name(e)) } else out.bad.push(`overflow-x ${ow}px: ${name(e)} "${txt(e)}"`)}
    if(oh>1)out.bad.push(`overflow-y ${oh}px: ${name(e)} "${txt(e)}"`);
    if(loose&&(inTile||e.classList.contains("tile")))return;
    const r=e.getBoundingClientRect(),box=e.parentElement.closest(".box,.panel,.top,#stage"),br=box.getBoundingClientRect(),t=0.6;
    if(r.width&&r.height&&(r.left<br.left-t||r.right>br.right+t||r.top<br.top-t||r.bottom>br.bottom+t))out.bad.push(`outside ${name(box)}: ${name(e)} "${txt(e)}"`);
  });
  /* 札どうし・札と卓の帯が重なっていないこと（止まっている画面だけ） */
  if(!loose&&!document.body.classList.contains("inround")){
    const rs=[...stage.querySelectorAll(".tile,.tb .mid,.byeinfo"+(phase==="before"?",#note":""))].filter(e=>phase!=="before"||!e.closest(".tb")).map(e=>[e,e.getBoundingClientRect()]);
    for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){const a=rs[i][1],b=rs[j][1];
      if(a.left<b.right-1&&b.left<a.right-1&&a.top<b.bottom-1&&b.top<a.bottom-1)out.bad.push(`overlap: ${name(rs[i][0])} "${txt(rs[i][0])}" × ${name(rs[j][0])} "${txt(rs[j][0])}"`)}
  }
  stage.querySelectorAll(".tile .nm,.tile .rec,.dk,.dk .t,.dk .b,.mid .no,.pill,.byeinfo p,#note li,.drop,.drop .nm,.msg,.steps .st,#pre span,.tc .nm,.tc .no,.tc .it,.rr>span,.rr .nm,.cnt").forEach(e=>{
    if(!e.offsetParent)return;const f=parseFloat(getComputedStyle(e).fontSize);if(f<20)out.small.push(name(e)+" "+f+"px")});
  return out;
};
</script>
</body>
</html>
